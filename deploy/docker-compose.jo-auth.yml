# jo-credit-os-demo (wise2-jocredit) and auth-gateway, moved off Vercel.
# Standalone project: never edits another compose file or port mapping.
# Host ports (documented in docs/PORT_CONTRACT.md): 3031 jo-credit, 3032 auth-gateway.
# Bound to 127.0.0.1 only; nginx is the public entry point.
name: wise2-jo-auth

services:
  jo-credit:
    build:
      context: ..
      dockerfile: apps/jo-credit-os-demo/Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.wise2.net}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:-}
        NEXT_PUBLIC_DISCORD_COMMUNITY_LINK: ${NEXT_PUBLIC_DISCORD_COMMUNITY_LINK:-}
        NEXT_PUBLIC_DISCORD_SERVER_INVITE: ${NEXT_PUBLIC_DISCORD_SERVER_INVITE:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_STRIPE_STARTER_PRICE_ID: ${NEXT_PUBLIC_STRIPE_STARTER_PRICE_ID:-}
        NEXT_PUBLIC_STRIPE_PROFESSIONAL_PRICE_ID: ${NEXT_PUBLIC_STRIPE_PROFESSIONAL_PRICE_ID:-}
        NEXT_PUBLIC_STRIPE_ENTERPRISE_PRICE_ID: ${NEXT_PUBLIC_STRIPE_ENTERPRISE_PRICE_ID:-}
        NEXT_PUBLIC_YOUTUBE_API_KEY: ${NEXT_PUBLIC_YOUTUBE_API_KEY:-}
        NEXT_PUBLIC_YOUTUBE_CHANNEL_ID: ${NEXT_PUBLIC_YOUTUBE_CHANNEL_ID:-}
        NEXT_PUBLIC_YOUTUBE_CHANNEL_URL: ${NEXT_PUBLIC_YOUTUBE_CHANNEL_URL:-}
        NEXT_PUBLIC_YOUTUBE_DEMO_VIDEO_ID: ${NEXT_PUBLIC_YOUTUBE_DEMO_VIDEO_ID:-}
        NEXT_PUBLIC_YOUTUBE_PLAYLIST_ID: ${NEXT_PUBLIC_YOUTUBE_PLAYLIST_ID:-}
    image: wise2/jo-credit-os-demo:latest
    container_name: wise2-jo-credit
    restart: unless-stopped
    # Server-side secrets (STRIPE_SECRET_KEY, DISCORD_*, GOOGLE_*) live in this untracked file.
    env_file:
      - path: .env.jo-credit
        required: false
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3031:3000"

  auth-gateway:
    build:
      context: ../services/auth-gateway
    image: wise2/auth-gateway:latest
    container_name: wise2-auth-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3013"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DB_HOST: ${AUTH_DB_HOST:?AUTH_DB_HOST is required}
      DB_PORT: ${AUTH_DB_PORT:-5432}
      DB_NAME: ${AUTH_DB_NAME:?AUTH_DB_NAME is required}
      DB_USER: ${AUTH_DB_USER:?AUTH_DB_USER is required}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3032:3013"
