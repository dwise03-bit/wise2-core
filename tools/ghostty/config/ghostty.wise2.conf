# WISE² Command Center — installer-managed include.
# This file is loaded LAST (via the WISE2 GHOSTTY block in ~/.config/ghostty/config),
# so its values win. Kept in sync with the inline WISE² theme so it no longer
# clobbers the OLED-void / SenCere-gold palette with the stock defaults.
# Core surface tokens: void ground, elevated chrome text, restrained empire-green focus.
background = 07080A
foreground = C8CCD4
cursor-color = 39FF14
cursor-text = 07080A
selection-background = 1A8A0A
selection-foreground = F0F0F2

# ANSI palette keeps logs readable while preserving WISE²'s industrial contrast.
palette = 0=07080A
palette = 1=EF4444
palette = 2=39FF14
palette = 3=F59E0B
palette = 4=3B82F6
palette = 5=9333EA
palette = 6=22D3EE
palette = 7=C8CCD4
palette = 8=6B7080
palette = 9=F87171
palette = 10=7CFF63
palette = 11=FBBF24
palette = 12=60A5FA
palette = 13=C084FC
palette = 14=67E8F9
palette = 15=F0F0F2

font-family = SF Mono
window-padding-x = 14
window-padding-y = 12
title = WISE² COMMAND CENTER · ONLINE
