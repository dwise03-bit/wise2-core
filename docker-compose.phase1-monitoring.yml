# WISE² OSS Toolkit — Phase 1: Uptime Monitoring + Error Tracking
# Uptime Kuma (service/endpoint uptime monitoring) + GlitchTip (self-hosted Sentry-compatible error tracking)
#
# Deploy standalone (does not touch existing docker-compose.prod.yml services):
#   docker compose -f docker-compose.phase1-monitoring.yml up -d
#
# NOTE: Port 8000 is referenced (commented out) in docker-compose.phone.yml for a future
# whisper service. GlitchTip's 8000 binding here is host-local only; verify no other
# service is bound to 8000 before deploying (`docker ps --format '{{.Ports}}' | grep 8000`).

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Uptime Kuma — self-hosted uptime monitor + status page
  # ---------------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: wise2-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3006:3001"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - wise2-toolkit
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3001/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # GlitchTip — self-hosted Sentry-compatible error tracking
  # ---------------------------------------------------------------------------
  glitchtip-postgres:
    image: postgres:15-alpine
    container_name: wise2-glitchtip-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-glitchtip}
    volumes:
      - glitchtip_postgres_data:/var/lib/postgresql/data
    networks:
      - wise2-toolkit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5

  glitchtip-redis:
    image: redis:7-alpine
    container_name: wise2-glitchtip-redis
    restart: unless-stopped
    volumes:
      - glitchtip_redis_data:/data
    networks:
      - wise2-toolkit
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    container_name: wise2-glitchtip-web
    restart: unless-stopped
    # NOTE: current glitchtip/glitchtip:latest replaced the old Celery/manage.sh
    # runtime with bin/run-*.sh scripts and a Django-native worker (no manage.sh,
    # no Celery). Run migrations before serving since bin/start.sh only
    # auto-migrates under Heroku's $DYNO convention, which we don't set.
    command: sh -c "./bin/run-migrate.sh && ./bin/run-web.sh"
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip}@glitchtip-postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set a strong random value in .env.production}
      PORT: 8000
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-https://errors.wise2.net}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-errors@wise2.net}
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
      ENABLE_OPEN_USER_REGISTRATION: "false"
      REDIS_URL: redis://glitchtip-redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
    networks:
      - wise2-toolkit
    healthcheck:
      # glitchtip/glitchtip:latest has neither wget nor curl; use the image's own healthcheck.py
      test: ["CMD", "python3", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: wise2-glitchtip-worker
    restart: unless-stopped
    # NOTE: this image version has no Celery; runworker --scheduler is the
    # combined worker+beat replacement (see bin/run-worker.sh in the image).
    command: ./bin/run-worker.sh
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip}@glitchtip-postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set a strong random value in .env.production}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-https://errors.wise2.net}
      REDIS_URL: redis://glitchtip-redis:6379/0
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
    networks:
      - wise2-toolkit

volumes:
  uptime_kuma_data:
    driver: local
  glitchtip_postgres_data:
    driver: local
  glitchtip_redis_data:
    driver: local

networks:
  wise2-toolkit:
    driver: bridge
    name: wise2-toolkit
