  server {
    listen 443 ssl http2;
    server_name wisedefensellc.com www.wisedefensellc.com;
    ssl_certificate /etc/nginx/certs/wisedefensellc.com.crt;
    ssl_certificate_key /etc/nginx/certs/wisedefensellc.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Serve WISE Defense landing page at root
    location = / {
      return 301 https://wisedefensellc.com/wise-defense/;
    }

    # Serve WISE Defense content from website app
    location /wise-defense/ {
      proxy_pass http://website_server/wise-defense/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # Static assets and Next.js routes
    location / {
      proxy_pass http://website_server;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }

    # API routes to backend
    location /api/ {
      proxy_pass http://api_server;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
