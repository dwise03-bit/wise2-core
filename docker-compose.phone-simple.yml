version: '3.8'

services:
  phone-api:
    build:
      context: .
      dockerfile: Dockerfile.phone-api
    container_name: wise2-phone-api
    ports:
      - "3002:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      API_BASE_URL: http://localhost:3000
      TENANT_ID: default-workspace
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
