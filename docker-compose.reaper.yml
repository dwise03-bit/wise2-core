version: '3.8'

services:
  # PostgreSQL Database (M0 Foundation)
  reaper-postgres:
    image: postgres:15-alpine
    container_name: reaper-postgres
    environment:
      POSTGRES_USER: wise2_local
      POSTGRES_PASSWORD: wise2_local_password
      POSTGRES_DB: wise2_core_dev
    ports:
      - "5432:5432"
    volumes:
      - reaper-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wise2_local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Queue (M1 Orchestration)
  reaper-redis:
    image: redis:7-alpine
    container_name: reaper-redis
    ports:
      - "6379:6379"
    volumes:
      - reaper-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server (wise2-core API)
  reaper-api:
    image: node:18-alpine
    container_name: reaper-api
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: "postgresql://wise2_local:wise2_local_password@reaper-postgres:5432/wise2_core_dev"
      REDIS_HOST: reaper-redis
      REDIS_PORT: 6379
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      reaper-postgres:
        condition: service_healthy
      reaper-redis:
        condition: service_healthy
    command: >
      sh -c "cd packages/api && npm install && npm run start:prod"
    restart: unless-stopped

  # Worker Service (M1 Audit Processing)
  reaper-worker:
    image: node:18-alpine
    container_name: reaper-worker
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: "postgresql://wise2_local:wise2_local_password@reaper-postgres:5432/wise2_core_dev"
      REDIS_HOST: reaper-redis
      REDIS_PORT: 6379
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      NODE_ENV: production
    depends_on:
      reaper-postgres:
        condition: service_healthy
      reaper-redis:
        condition: service_healthy
    command: >
      sh -c "cd services/reaper-worker && npm install && npm run start"
    restart: unless-stopped

volumes:
  reaper-postgres-data:
  reaper-redis-data:

networks:
  default:
    name: reaper-network
