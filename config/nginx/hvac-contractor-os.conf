# HVAC Contractor OS - Nginx Configuration
# Routes: wise2.net/hvac*
# API Backend: localhost:3000/api/jobs/*/captures
#             localhost:3000/api/diagnostics/*
#             localhost:3000/jobs (WebSocket)

upstream hvac_api {
    server localhost:3000;
    keepalive 32;
}

upstream hvac_websocket {
    server localhost:3000;
    keepalive 32;
}

# HVAC Dashboard - Frontend
location /hvac/ {
    # Serve Next.js app from command-center
    proxy_pass http://hvac_api;
    proxy_http_version 1.1;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Standard headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Buffering
    proxy_buffering off;
    proxy_request_buffering off;

    # Timeouts (for long-running uploads)
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

# Ray-Ban Dashboard
location /rayban/ {
    proxy_pass http://hvac_api;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_request_buffering off;
}

# HVAC API Endpoints
location /api/jobs/ {
    proxy_pass http://hvac_api;
    proxy_http_version 1.1;

    # WebSocket upgrade for real-time updates
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Allow large file uploads (500MB)
    client_max_body_size 500M;

    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering off;
}

# Diagnostics API
location /api/diagnostics/ {
    proxy_pass http://hvac_api;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffering off;
}

# WebSocket Gateway for Real-time Updates
location /jobs {
    proxy_pass http://hvac_websocket;
    proxy_http_version 1.1;

    # WebSocket headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket timeouts
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_buffering off;
    proxy_request_buffering off;
}

# Health check endpoint
location /api/hvac/health {
    proxy_pass http://hvac_api;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    access_log off;
}
