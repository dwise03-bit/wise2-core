[tool.poetry]
name = "wise2-sound-labs-bridge"
version = "0.1.0"
description = "WISE² Sound Labs MIDI Bridge for MASCHINE MIKRO MK3"
authors = ["Daniel Wise <dwise03@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
websockets = "^12.0"
python-rtmidi = "^0.4.9"
mido = "^1.3.2"
python-dotenv = "^1.0.0"
requests = "^2.31.0"
aiohttp = "^3.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
black = "^23.11.0"
ruff = "^0.1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
