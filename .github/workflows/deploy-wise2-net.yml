name: Deploy to wise2.net

# Manual full-stack sync for the home server (Tailscale + user systemd).
# Public TLS is via Cloudflare tunnel; health checks use loopback only.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Sync wise2-core on home server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            DEPLOY_DIR=/home/dwise/deploy/wise2-core
            CLONE_URL=https://github.com/dwise03-bit/wise2-core.git
            UNITS="wise2-api.service wise2-website.service"

            mkdir -p "$(dirname "$DEPLOY_DIR")"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              git clone "$CLONE_URL" "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git fetch origin main
            git reset --hard origin/main

            restarted=0
            for UNIT in $UNITS; do
              if systemctl --user list-unit-files --type=service 2>/dev/null | grep -qx "$UNIT"; then
                systemctl --user restart "$UNIT"
                restarted=1
              else
                echo "TODO: create user systemd unit ${UNIT} on the home server"
              fi
            done
            if [ "$restarted" -eq 0 ]; then
              echo "No systemd units were restarted; configure units before relying on this workflow"
              exit 1
            fi

      - name: Verify loopback health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            curl -fsS http://127.0.0.1:3010/api/health >/dev/null
            curl -fsS http://127.0.0.1:3001/ >/dev/null
            echo "Loopback API and website health checks passed"
