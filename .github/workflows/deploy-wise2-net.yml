name: Deploy to wise2.net

# Manual only. This workflow remains a full-stack recovery path: it rebuilds all
# services in docker-compose.prod.yml and runs `prisma db push` in production.
# Standard website deploys go through deploy.yml.
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/wise2-clipper-api
  IMAGE_WEB: ghcr.io/${{ github.repository }}/wise2-clipper-web
  DOMAIN: wise2.net

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push Docker images
        run: |
          echo "Building Docker images for wise2.net deployment..."
          docker compose -f docker-compose.prod.yml build
      
      - name: Deploy to VPS via SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" || {
            echo "DEPLOY_HOST, DEPLOY_USER, and DEPLOY_KEY must be configured"
            exit 1
          }
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/vps-key
          chmod 600 ~/.ssh/vps-key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          ssh -i ~/.ssh/vps-key -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" << 'DEPLOY'
          
          set -e
          cd /home/dwise/wise2-core
          
          echo "Starting deployment to wise2.net..."
          
          # Pull latest code
          git pull origin main
          
          # Deploy with Docker Compose v2
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          
          # Run database migrations
          docker compose -f docker-compose.prod.yml exec -T api npx prisma db push
          
          # Verify deployment
          sleep 10
          curl -s https://wise2.net/api/v1/health || true
          
          echo "Deployment to wise2.net complete"
          
          DEPLOY
      
      - name: Verify live deployment
        run: |
          echo "Verifying public site..."
          curl -sI https://wise2.net || echo "Note: DNS may take time to propagate"
          echo "Deployment workflow complete"
