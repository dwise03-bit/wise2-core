name: Deploy to wise2.net

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/wise2-clipper-api
  IMAGE_WEB: ghcr.io/${{ github.repository }}/wise2-clipper-web
  VPS_HOST: 173.208.147.165
  VPS_USER: dwise
  DOMAIN: wise2.net

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push Docker images
        run: |
          echo "Building Docker images for wise2.net deployment..."
          docker-compose -f docker-compose.prod.yml build
      
      - name: Deploy to VPS via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ env.VPS_HOST }}
          VPS_USER: ${{ env.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/vps-key
          chmod 600 ~/.ssh/vps-key
          
          ssh -i ~/.ssh/vps-key -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'DEPLOY'
          
          set -e
          cd /home/dwise/wise2-core
          
          echo "🚀 Starting deployment to wise2.net..."
          
          # Pull latest code
          git pull origin main
          
          # Deploy with docker-compose
          docker-compose -f docker-compose.prod.yml pull
          docker-compose -f docker-compose.prod.yml up -d
          
          # Run database migrations
          docker-compose -f docker-compose.prod.yml exec -T api npx prisma db push
          
          # Verify deployment
          sleep 10
          curl -s https://wise2.net/api/v1/health || true
          
          echo "✅ Deployment to wise2.net complete!"
          
          DEPLOY
      
      - name: Verify live deployment
        run: |
          echo "Verifying https://wise2.net..."
          curl -sI https://wise2.net || echo "Note: DNS may take time to propagate"
          echo "✅ Deployment workflow complete"

