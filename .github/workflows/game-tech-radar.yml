name: WISE2 Game Tech Radar
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'
  push:
    paths: ['WISE2-GAME-ARSENAL/**', '.github/workflows/game-tech-radar.yml']
  pull_request:
    paths: ['WISE2-GAME-ARSENAL/**', '.github/workflows/game-tech-radar.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: WISE2-GAME-ARSENAL
  radar:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run radar
        working-directory: WISE2-GAME-ARSENAL
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wise2-game-tech-radar
          path: WISE2-GAME-ARSENAL/research/reports/
          retention-days: 90
