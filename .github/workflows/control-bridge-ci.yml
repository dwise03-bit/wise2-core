name: WISE2 Control Bridge CI

on:
  push:
    branches:
      - 'feat/control-bridge'
  pull_request:
    branches:
      - main
    paths:
      - 'services/control-bridge/**'
      - 'docker-compose.control.yml'
      - 'docker-compose.production.yml'
      - '.github/workflows/control-bridge-ci.yml'
      - 'scripts/control-health-local.sh'
      - 'scripts/health-check-comprehensive.sh'

jobs:
  control-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Run control bridge tests
        run: pnpm --dir services/control-bridge test

      - name: Syntax check server
        run: node --check services/control-bridge/src/server.js

      - name: Build control bridge image
        run: docker build -f services/control-bridge/Dockerfile -t wise2-control-bridge:ci .

      - name: Validate production Compose overlay
        env:
          CONTROL_AUTH_TOKEN: ci-only-control-token-1234567890
        run: docker compose -f docker-compose.production.yml -f docker-compose.control.yml config >/dev/null
