name: Build BYTE MINI 4.0 Firmware

on:
  push:
    branches: [ main ]
    paths:
      - 'products/byte-mini-4.0/firmware/**'
      - '.github/workflows/build-byte-mini-firmware.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'products/byte-mini-4.0/firmware/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v5.3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set ESP32-C6 target
        working-directory: products/byte-mini-4.0/firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py set-target esp32c6

      - name: Build firmware
        working-directory: products/byte-mini-4.0/firmware
        run: |
          . /opt/esp/idf/export.sh
          idf.py build

      - name: Extract binary files
        working-directory: products/byte-mini-4.0/firmware
        run: |
          mkdir -p artifacts
          cp build/bootloader/bootloader.bin artifacts/
          cp build/partition_table/partition-table.bin artifacts/
          cp build/byte_mini_4.0.bin artifacts/
          cp build/flasher_args.json artifacts/
          echo "Firmware built successfully!"
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: byte-mini-4.0-firmware
          path: products/byte-mini-4.0/firmware/artifacts/
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: products/byte-mini-4.0/firmware/artifacts/**
          body: |
            # BYTE MINI 4.0 Firmware Release

            ## Build Information
            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref }}
            - **Date**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

            ## Files
            - `bootloader.bin` - Bootloader (flash at 0x0)
            - `partition-table.bin` - Partition table (flash at 0x8000)
            - `byte_mini_4.0.bin` - Application firmware (flash at 0x10000)
            - `flasher_args.json` - ESP-IDF flash arguments

            ## Flash Instructions
            ```bash
            esptool.py -p /dev/ttyUSB0 write_flash \
              0x0 bootloader.bin \
              0x8000 partition-table.bin \
              0x10000 byte_mini_4.0.bin
            ```

            Or use idf.py:
            ```bash
            idf.py -p /dev/ttyUSB0 flash
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Status
        if: success()
        run: |
          echo "✅ Firmware build successful!"
          echo "📦 Artifacts available for download"
          echo "🔧 Flash with: esptool.py -p /dev/ttyUSB0 write_flash..."
