name: Build OpenXR Native Library

on:
  push:
    paths:
      - 'apps/fieldtech-android/app/src/main/cpp/**'
      - '.github/workflows/build-openxr.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Create build directory
        run: mkdir -p apps/fieldtech-android/app/src/main/cpp/build

      - name: Configure CMake
        run: |
          cd apps/fieldtech-android/app/src/main/cpp/build
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -G "Ninja" \
            ..

      - name: Build
        run: |
          cd apps/fieldtech-android/app/src/main/cpp/build
          cmake --build . --config Release

      - name: Install library
        run: |
          mkdir -p apps/fieldtech-android/app/src/main/jniLibs/arm64-v8a
          cp apps/fieldtech-android/app/src/main/cpp/build/libopenxr_vr.so \
             apps/fieldtech-android/app/src/main/jniLibs/arm64-v8a/

      - name: Verify library
        run: |
          ls -lh apps/fieldtech-android/app/src/main/jniLibs/arm64-v8a/libopenxr_vr.so
          file apps/fieldtech-android/app/src/main/jniLibs/arm64-v8a/libopenxr_vr.so

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: openxr-library
          path: apps/fieldtech-android/app/src/main/jniLibs/
          retention-days: 30

      - name: Create Pull Request with compiled library
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'ci: Add compiled OpenXR native library'
          title: 'Add compiled OpenXR native library for Meta Quest'
          body: |
            ## Compiled OpenXR Library

            This PR contains the pre-built OpenXR native library for Meta Quest.

            **Generated by**: CI/CD build
            **Library**: libopenxr_vr.so (arm64-v8a)

            After merge, rebuild the APK:
            ```bash
            ./gradlew clean assembleDebug
            adb install app/build/outputs/apk/debug/app-debug.apk
            ```
          branch: ci/openxr-library
          delete-branch: true
          assignees: dwise

  download-openxr-sdk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download OpenXR Loader
        run: |
          # Download from Khronos official OpenXR SDK
          git clone https://github.com/KhronosGroup/OpenXR-SDK.git /tmp/openxr-sdk --depth 1

          # The loader library needs to be compiled or downloaded from Meta
          # For now, we document the process
          echo "OpenXR Loader requires compilation or download from:"
          echo "1. Khronos: https://github.com/KhronosGroup/OpenXR-SDK"
          echo "2. Meta: https://developers.meta.com/resources/downloads/"

      - name: Note
        run: |
          echo "⚠️  OpenXR Loader (libopenxr_loader.so) must be placed at:"
          echo "apps/fieldtech-android/app/src/main/jniLibs/arm64-v8a/libopenxr_loader.so"
          echo ""
          echo "After both libraries are in place, rebuild the APK."
