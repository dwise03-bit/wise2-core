name: Deploy Website to WISE² VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'packages/ui-components/**'
      - 'packages/brand-lock/**'
      - 'packages/db/**'
      - 'Dockerfile.website'
      - 'docker-compose.prod.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-website-vps.yml'
  workflow_dispatch:

concurrency:
  group: wise2-website-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy wise2.net
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.WISE2_VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_KEY" || { echo "Missing WISE2_VPS_SSH_KEY (or SSH_PRIVATE_KEY) repository secret"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 173.208.147.165 >> ~/.ssh/known_hosts

      - name: Sync repository to production VPS
        run: |
          rsync -az             --exclude '.git'             --exclude 'node_modules'             --exclude '.next'             --exclude '.env'             --exclude '.env.*'             --exclude 'data'             --exclude 'logs'             ./ dwise@173.208.147.165:/home/dwise/wise2-core/

      - name: Build and restart website
        run: |
          ssh dwise@173.208.147.165 'cd /home/dwise/wise2-core && bash scripts/deploy-website-vps.sh'

      - name: Verify production
        run: |
          for i in {1..12}; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' https://wise2.net/travel || true)"
            if [ "$code" = "200" ]; then
              echo "WISE² Travel is live: https://wise2.net/travel"
              exit 0
            fi
            echo "Attempt $i: HTTP $code; waiting..."
            sleep 10
          done
          echo "Production verification failed"
          exit 1
