name: Deploy Clipper

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: main
      rollback:
        description: Roll back to the previously deployed commit
        required: false
        type: boolean
        default: false

concurrency:
  group: clipper-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy Clipper on home server
        env:
          DEPLOY_REF: ${{ inputs.ref }}
          ROLLBACK: ${{ inputs.rollback }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 30m
          envs: DEPLOY_REF,ROLLBACK
          script: |
            set -eu
            DEPLOY_DIR=/home/dwise/deploy/wise2-core
            CLONE_URL=https://github.com/dwise03-bit/wise2-core.git
            UNIT=clipper.service
            HEALTH_URL=http://127.0.0.1:3015/
            STATE_DIR=/home/dwise/.wise2-deploy
            STATE_FILE="$STATE_DIR/clipper-previous-ref"
            DEPLOY_REF="${DEPLOY_REF:-main}"
            ROLLBACK="${ROLLBACK:-false}"

            mkdir -p "$(dirname "$DEPLOY_DIR")" "$STATE_DIR"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              git clone "$CLONE_URL" "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"

            current_ref="$(git rev-parse HEAD)"
            target_ref="$DEPLOY_REF"
            if [ "$ROLLBACK" = "true" ]; then
              test -s "$STATE_FILE" || { echo "No previous Clipper deployment is recorded."; exit 1; }
              target_ref="$(cat "$STATE_FILE")"
            fi

            git fetch --prune origin
            target_sha="$(git rev-parse "origin/${target_ref}" 2>/dev/null || git rev-parse "$target_ref")"
            printf '%s\n' "$current_ref" > "$STATE_FILE"
            echo "Deploying Clipper commit ${target_sha}"
            git reset --hard "$target_sha"

            if systemctl --user list-unit-files --type=service 2>/dev/null | grep -qx "${UNIT}"; then
              systemctl --user restart "$UNIT"
            else
              echo "TODO: create user systemd unit ${UNIT} on the home server for Clipper"
              exit 1
            fi

            for attempt in $(seq 1 18); do
              if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
                echo "Clipper health check passed (loopback)"
                exit 0
              fi
              sleep 5
            done

            echo "Clipper health check failed; restoring previous commit ${current_ref}"
            git reset --hard "$current_ref"
            if systemctl --user list-unit-files --type=service 2>/dev/null | grep -qx "${UNIT}"; then
              systemctl --user restart "$UNIT"
            fi
            exit 1
