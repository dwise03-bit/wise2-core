name: WISE2 Sound Labs Browser Route Repair
on:
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: wise2-soundlabs-browser-route
  cancel-in-progress: true
jobs:
  repair:
    if: >-
      github.event.issue.user.login == 'dwise03-bit' &&
      github.event.issue.title == 'WISE2 OPS: repair-soundlabs-browser-route'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Verify authorized host
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = wise2
          node -e 'if (+process.versions.node.split(".")[0] < 20) process.exit(1)'
      - name: Sparse fetch Sound Labs source
        shell: bash
        run: |
          set -euo pipefail
          src="$HOME/.local/state/wise2-soundlabs-route/source"
          rm -rf "$src"
          mkdir -p "$src"
          git -C "$src" init
          git -C "$src" remote add origin https://github.com/dwise03-bit/wise2-core.git
          git -C "$src" config core.sparseCheckout true
          printf '/apps/sound-labs-ui/\n' > "$src/.git/info/sparse-checkout"
          git -C "$src" fetch --depth=1 --filter=blob:none origin main
          git -C "$src" checkout --detach FETCH_HEAD
      - name: Build Sound Labs controller
        shell: bash
        run: |
          set -euo pipefail
          cd "$HOME/.local/state/wise2-soundlabs-route/source/apps/sound-labs-ui"
          npm install --no-audit --no-fund --ignore-scripts
          npm run build
          test -f dist/index.html
          grep -q 'WISE² Sound Labs' dist/index.html
      - name: Start persistent Tailscale browser route
        shell: bash
        run: |
          set -euo pipefail
          state="$HOME/.local/state/wise2-soundlabs-route"
          mkdir -p "$state"
          log="$state/soundlabs-ui.log"
          pidfile="$state/soundlabs-ui.pid"
          if test -f "$pidfile"; then
            old="$(cat "$pidfile" 2>/dev/null || true)"
            if test -n "$old" && kill -0 "$old" 2>/dev/null; then
              cmd="$(tr '\0' ' ' < "/proc/$old/cmdline" 2>/dev/null || true)"
              case "$cmd" in *"8088"*) kill "$old"; for i in $(seq 1 20); do kill -0 "$old" 2>/dev/null || break; sleep .2; done ;; esac
            fi
          fi
          if test -f "$state/proxy.pid"; then
            old="$(cat "$state/proxy.pid" 2>/dev/null || true)"
            test -z "$old" || kill "$old" 2>/dev/null || true
          fi
          cd "$HOME/.local/state/wise2-soundlabs-route/source/apps/sound-labs-ui"
          RUNNER_TRACKING_ID=wise2-soundlabs-ui nohup ./node_modules/.bin/vite preview --host 0.0.0.0 --port 8088 --strictPort >"$log" 2>&1 </dev/null &
          echo $! > "$pidfile"
          ok=0
          for i in $(seq 1 40); do
            code="$(curl -sS -o /tmp/soundlabs-ui -w '%{http_code}' --max-time 4 -H 'Host: wise2:8088' http://127.0.0.1:8088/ 2>/dev/null || true)"
            if test "$code" = 200 && grep -q 'WISE² Sound Labs' /tmp/soundlabs-ui; then ok=1; break; fi
            sleep 1
          done
          test "$ok" = 1 || { tail -n 100 "$log"; echo "::error::Sound Labs UI failed"; exit 1; }
          echo "PASS: WISE² Sound Labs UI is live at http://wise2:8088/"
