name: Diagnose Dog and Pony 404
on:
  push:
    branches: [fix/dogandpony-404-diagnostics-20261122]
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: [self-hosted]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect route and public response without changing production
        shell: bash
        run: |
          set +e
          echo "HOST: $(hostname)"
          echo "COMMIT: $(git rev-parse HEAD)"
          test -f apps/website/app/dogandpony/page.tsx && echo "SOURCE_ROUTE_PRESENT=yes"
          echo "PUBLIC RESPONSE:"
          curl -sSIL --max-time 15 https://wise2.net/dogandpony | head -25
          echo "LOCAL LISTENERS:"
          ss -ltn | grep -E ':(80|443|3000|3001|3098) ' || true
          echo "DOCKER WEBSITE CONTAINERS:"
          docker ps --format '{{.Names}} {{.Image}} {{.Ports}}' | grep -Ei 'website|next|wise2' | head -20 || true
          echo "NGINX ROUTE REFERENCES:"
          if command -v nginx >/dev/null 2>&1; then nginx -T 2>/dev/null | grep -nE 'server_name wise2.net|location /|proxy_pass' | head -55; fi
          echo "PROBE COMPLETE: no services changed"
