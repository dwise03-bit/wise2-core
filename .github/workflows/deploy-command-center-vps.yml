name: Deploy WOJI Command Center to VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-command-center-vps
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: wise2-command-center/package-lock.json

      - name: Install Command Center dependencies
        working-directory: wise2-command-center
        run: npm ci

      - name: Test Command Center
        working-directory: wise2-command-center
        run: npm test

      - name: Type-check Command Center
        working-directory: wise2-command-center
        run: npm run type-check

      - name: Build Command Center
        working-directory: wise2-command-center
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy Command Center on home server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            DEPLOY_DIR=/home/dwise/deploy/wise2-dashboard
            CLONE_URL=https://github.com/dwise03-bit/wise2-core.git
            UNIT=wise2-dashboard.service
            HEALTH_URL=http://127.0.0.1:3004/woji
            APP_DIR=wise2-command-center

            mkdir -p "$(dirname "$DEPLOY_DIR")"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              git clone "$CLONE_URL" "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git fetch origin main
            git reset --hard origin/main

            if [ -f "$APP_DIR/package.json" ]; then
              (cd "$APP_DIR" && npm ci --omit=dev && npm run build)
            else
              echo "Expected ${APP_DIR} in checkout; refusing to deploy"
              exit 1
            fi

            if systemctl --user list-unit-files --type=service 2>/dev/null | grep -qx "${UNIT}"; then
              systemctl --user restart "$UNIT"
            else
              echo "TODO: create user systemd unit ${UNIT} on the home server for Command Center"
              exit 1
            fi

            for attempt in 1 2 3 4 5 6; do
              if curl -fsS "$HEALTH_URL" | grep -qi WOJI; then
                echo "Command Center health check passed (loopback)"
                exit 0
              fi
              sleep 5
            done
            echo "Command Center health check failed on loopback"
            exit 1
