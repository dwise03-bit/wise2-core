name: Deploy WOJI Command Center to VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-command-center-vps
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: wise2-command-center/package-lock.json

      - name: Install Command Center dependencies
        working-directory: wise2-command-center
        run: npm ci

      - name: Test Command Center
        working-directory: wise2-command-center
        run: npm test

      - name: Type-check Command Center
        working-directory: wise2-command-center
        run: npm run type-check

      - name: Build Command Center
        working-directory: wise2-command-center
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Command Center on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 30m
          script: |
            set -eu

            APP_DIR=/home/dwise/wise2-core
            COMPOSE_FILE=docker-compose.prod.yml
            SERVICE=command-center
            CONTAINER=wise2-command-center
            LEGACY_UNIT=wise2-command-center.service
            LOCAL_URL=http://127.0.0.1:3004/woji
            ROLLBACK_TAG=wise2-core-command-center:rollback-${{ github.run_id }}

            cd "$APP_DIR"
            git fetch origin main

            if [ -n "$(git status --porcelain)" ]; then
              echo "The production checkout has uncommitted changes; refusing to overwrite them."
              git status --short
              exit 1
            fi

            git checkout main
            git merge --ff-only origin/main
            docker compose -f "$COMPOSE_FILE" config --services | grep -qx "$SERVICE"

            PORT_OWNERS="$(docker ps --filter publish=3004 --format '{{.Names}}')"
            if [ -n "$PORT_OWNERS" ] && ! printf '%s\n' "$PORT_OWNERS" | grep -qx "$CONTAINER"; then
              echo "Port 3004 is owned by a different container; refusing to replace it without verifying its role."
              docker ps --filter publish=3004 --format 'name={{.Names}} image={{.Image}} ports={{.Ports}}'
              for OWNER in $PORT_OWNERS; do
                docker container inspect --format 'name={{.Name}} compose_project={{index .Config.Labels "com.docker.compose.project"}} compose_service={{index .Config.Labels "com.docker.compose.service"}} image={{.Config.Image}}' "$OWNER"
              done
              exit 1
            fi

            UNIT_WAS_ACTIVE=false
            UNIT_WAS_ENABLED=false
            UNIT_PID=""
            if sudo -n systemctl is-active --quiet "$LEGACY_UNIT"; then
              UNIT_WAS_ACTIVE=true
              UNIT_PID="$(sudo -n systemctl show --property MainPID --value "$LEGACY_UNIT")"
            fi
            if [ "$(sudo -n systemctl is-enabled "$LEGACY_UNIT" 2>/dev/null || true)" = enabled ]; then
              UNIT_WAS_ENABLED=true
            fi

            LISTENER_PID="$(sudo -n ss -ltnp | sed -n '/127\.0\.0\.1:3004/s/.*pid=\([0-9][0-9]*\).*/\1/p' | head -n 1)"
            if [ -n "$LISTENER_PID" ] && [ -z "$PORT_OWNERS" ] && [ "$LISTENER_PID" != "$UNIT_PID" ]; then
              echo "Port 3004 is owned by an unexpected host process; refusing to stop it."
              sudo -n ss -ltnp | grep ':3004' || true
              ps -o pid,ppid,user,lstart,args -p "$LISTENER_PID" || true
              exit 1
            fi
            if [ -n "$LISTENER_PID" ] && [ "$LISTENER_PID" = "$UNIT_PID" ]; then
              echo "Migrating $LEGACY_UNIT from the legacy host process to the canonical Compose container."
            fi

            OLD_IMAGE=""
            if docker container inspect "$CONTAINER" >/dev/null 2>&1; then
              OLD_IMAGE="$(docker container inspect --format '{{.Image}}' "$CONTAINER")"
              docker image tag "$OLD_IMAGE" "$ROLLBACK_TAG"
            fi

            docker compose -f "$COMPOSE_FILE" build "$SERVICE"

            rollback() {
              echo "Command Center deployment failed; attempting rollback."
              docker container rm -f "$CONTAINER" >/dev/null 2>&1 || true
              if [ -n "$OLD_IMAGE" ]; then
                docker image tag "$ROLLBACK_TAG" wise2-core-command-center:latest
                docker compose -f "$COMPOSE_FILE" up -d --no-deps "$SERVICE"
              elif [ "$UNIT_WAS_ACTIVE" = true ]; then
                if [ "$UNIT_WAS_ENABLED" = true ]; then
                  sudo -n systemctl enable "$LEGACY_UNIT" >/dev/null
                fi
                sudo -n systemctl start "$LEGACY_UNIT"
              fi
              docker compose -f "$COMPOSE_FILE" logs --tail=100 "$SERVICE" || true
            }
            trap rollback EXIT INT TERM

            if [ "$UNIT_WAS_ACTIVE" = true ]; then
              sudo -n systemctl stop "$LEGACY_UNIT"
            fi
            sudo -n systemctl disable "$LEGACY_UNIT" >/dev/null 2>&1 || true
            docker container rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker compose -f "$COMPOSE_FILE" up -d --no-deps --force-recreate "$SERVICE"

            attempt=1
            while [ "$attempt" -le 30 ]; do
              STATUS="$(docker container inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$CONTAINER" 2>/dev/null || true)"
              if [ "$STATUS" = healthy ] && curl -fsS "$LOCAL_URL" | grep -qi WOJI; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Command Center did not become healthy. Last status: $STATUS"
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep 5
            done

            NGINX_CONFIG="$(sudo -n nginx -T 2>&1)"
            printf '%s\n' "$NGINX_CONFIG" | grep -Eq 'server_name[[:space:]]+command\.wise2\.net'
            printf '%s\n' "$NGINX_CONFIG" | grep -Eq 'proxy_pass[[:space:]]+http://127\.0\.0\.1:3004'

            trap - EXIT INT TERM
            docker compose -f "$COMPOSE_FILE" ps "$SERVICE"
            docker compose -f "$COMPOSE_FILE" logs --tail=40 "$SERVICE"
            sudo -n systemctl is-active "$LEGACY_UNIT" 2>/dev/null | grep -qx inactive
            sudo -n systemctl is-enabled "$LEGACY_UNIT" 2>/dev/null | grep -qx disabled
            docker image rm "$ROLLBACK_TAG" >/dev/null 2>&1 || true

      - name: Verify VPS HTTPS ingress repeatedly
        env:
          VPS_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
            curl -fsS --retry 2 --retry-delay 2 --resolve "command.wise2.net:443:$VPS_HOST" https://command.wise2.net/woji | grep -qi WOJI
            sleep 2
          done

      - name: Report public DNS readiness
        run: |
          if getent ahostsv4 command.wise2.net >/dev/null 2>&1; then
            curl -fsS https://command.wise2.net/woji | grep -qi WOJI
          else
            echo "::warning::command.wise2.net has no public DNS record. Add an A record to the VPS before announcing the URL."
          fi
