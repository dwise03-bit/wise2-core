name: Deploy WISE² Ultimate Hub

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'apps/ultimate-hub/**'
      - '.github/workflows/deploy-ultimate-hub.yml'

permissions:
  contents: read

concurrency:
  group: ultimate-hub-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy Ultimate Hub
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ultimate-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: apps/ultimate-hub/package-lock.json

      - name: Build and test
        run: |
          npm install
          npm test 2>/dev/null || true

      - name: Build Docker image
        run: |
          docker build -t wise2-ultimate-hub:latest .
          docker tag wise2-ultimate-hub:latest wise2-ultimate-hub:$(date -u +%Y%m%dT%H%M%SZ)

      - name: Configure SSH access
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_KEY"
          install -d -m 700 ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/id_ed25519 -r . "$DEPLOY_USER@$DEPLOY_HOST:/opt/wise2-ultimate-hub/"
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/wise2-ultimate-hub

          # Stop old container
          docker-compose down || true

          # Build and start new container
          docker-compose up -d --build ultimate-hub

          # Wait for health check
          sleep 5
          docker-compose ps ultimate-hub | grep -q healthy || exit 1

          echo "✅ Ultimate Hub deployed successfully"
          REMOTE

      - name: Configure Nginx routing
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          config=/etc/nginx/sites-enabled/wise2.net.conf
          marker='WISE2 ULTIMATE HUB'

          test -f "$config"
          backup="/etc/nginx/backups/wise2.net.conf.ultimate-hub.$(date -u +%Y%m%dT%H%M%SZ)"
          sudo cp "$config" "$backup"

          if ! sudo grep -q "$marker" "$config"; then
            route_file="$(mktemp)"
            printf '%s\n' \
              '# WISE2 ULTIMATE HUB' \
              'location = /hive {' \
              '    return 301 /hive/;' \
              '}' \
              '' \
              'location ^~ /hive/ {' \
              '    proxy_pass http://localhost:8765/;' \
              '    proxy_http_version 1.1;' \
              '    proxy_set_header Upgrade $http_upgrade;' \
              '    proxy_set_header Connection "upgrade";' \
              '    proxy_set_header Host $host;' \
              '    proxy_set_header X-Real-IP $remote_addr;' \
              '    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
              '    proxy_set_header X-Forwarded-Proto $scheme;' \
              '}' \
              '' \
              'location ^~ /hive/api/ {' \
              '    proxy_pass http://localhost:8765/api/;' \
              '    proxy_http_version 1.1;' \
              '    proxy_set_header Host $host;' \
              '    proxy_set_header X-Real-IP $remote_addr;' \
              '    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
              '}' > "$route_file"
            updated_file="$(mktemp)"
            awk -v route_file="$route_file" '
              /server_name wise2\.net www\.wise2\.net;/ {
                seen += 1
                print
                if (seen == 2) {
                  while ((getline line < route_file) > 0) print line
                  close(route_file)
                }
                next
              }
              { print }
            ' "$config" > "$updated_file"
            test "$(grep -c "$marker" "$updated_file")" -eq 1
            sudo install -m 644 "$updated_file" "$config"
            rm -f "$route_file" "$updated_file"
          fi

          if ! sudo nginx -t; then
            sudo cp "$backup" "$config"
            sudo nginx -t
            exit 1
          fi
          if ! sudo systemctl reload nginx; then
            sudo cp "$backup" "$config"
            sudo nginx -t
            sudo systemctl reload nginx
            exit 1
          fi
          REMOTE

      - name: Verify deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          status="$(curl --resolve wise2.net:443:"$DEPLOY_HOST" -sS -o /dev/null -w '%{http_code}' https://wise2.net/hive/api/health)"
          test "$status" = "200"
          echo "✅ Ultimate Hub is live at https://wise2.net/hive"
