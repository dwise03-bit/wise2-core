name: Studio iOS Control CI

on:
  push:
    branches: ['feat/wise2-studio-ios-control']
  pull_request:
    branches: [main]
    paths:
      - 'apps/studio/**'
      - '.github/workflows/studio-ios-control-ci.yml'

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Resolve workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Type check Studio
        run: pnpm --dir apps/studio type-check
      - name: Build Studio
        run: pnpm --dir apps/studio build
      - name: Reject mock OBS control responses
        shell: bash
        run: |
          ! grep -RInE 'Mock response|Mock data|TODO: (Connect to OBS|Get stats from OBS)' \
            apps/studio/app/api/obs/stream apps/studio/app/api/obs/stats apps/studio/app/api/obs/scenes/route.ts
