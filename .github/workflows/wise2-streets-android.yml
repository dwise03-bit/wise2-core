name: WISE2 Streets Android Prototype
on:
  push:
    branches: [feature/wise2-streets-android-prototype]
    paths: ['WISE2-GAME-ARSENAL/wise2-streets/**', '.github/workflows/wise2-streets-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Install Godot 4.3 and matching Android export templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. ~/.local/share/godot/export_templates/4.3.stable/
      - name: Create debug signing key
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -noprompt -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Android Debug,O=WISE2,C=US"
      - name: Import project and validate scripts
        working-directory: WISE2-GAME-ARSENAL/wise2-streets
        run: godot --headless --editor --path . --import --quit
      - name: Export debug APK
        working-directory: WISE2-GAME-ARSENAL/wise2-streets
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug Android build/wise2-streets-debug.apk
          test -s build/wise2-streets-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wise2-streets-android-debug
          path: WISE2-GAME-ARSENAL/wise2-streets/build/wise2-streets-debug.apk
          if-no-files-found: error
