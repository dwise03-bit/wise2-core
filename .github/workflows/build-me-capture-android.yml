name: Build WISE2 ME Capture Android

on:
  push:
    branches: [main, release/me-capture-visual-v2]
    paths:
      - 'apps/wise2-me-capture-android/**'
      - '.github/workflows/build-me-capture-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/wise2-me-capture-android/**'
      - '.github/workflows/build-me-capture-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/wise2-me-capture-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wise2-me-capture-debug
          path: apps/wise2-me-capture-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
