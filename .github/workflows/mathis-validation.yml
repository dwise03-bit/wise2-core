name: Mathis Electric integration validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/website/app/mathis-electric/**'
      - 'apps/website/middleware.ts'
      - 'apps/website/next.config.js'
      - 'apps/website/public/mathis/**'
      - 'scripts/ops/verify-mathis-site.mjs'
      - '.github/workflows/mathis-validation.yml'

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check website
        run: pnpm --filter @wise2/website type-check
      - name: Build website
        run: pnpm --filter @wise2/website build
