name: Website quality

on:
  pull_request:
    paths:
      - 'apps/website/**'
      - 'packages/db/**'
      - 'packages/ui-components/**'
      - 'packages/brand-lock/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/website-quality.yml'
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'packages/db/**'
      - 'packages/ui-components/**'
      - 'packages/brand-lock/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/website-quality.yml'

jobs:
  website:
    name: Website quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint changed website files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          mapfile -t files < <(
            git diff --name-only "$BASE_SHA" HEAD -- 'apps/website/**/*.js' 'apps/website/**/*.jsx' 'apps/website/**/*.ts' 'apps/website/**/*.tsx' |
              grep -E '\.(js|jsx|ts|tsx)$' |
              sed 's#^apps/website/##' || true
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No website source files changed."
            exit 0
          fi

          printf 'Linting changed website files:\n%s\n' "${files[@]}"
          pnpm --filter @wise2/website exec eslint "${files[@]}"

      - name: Type-check
        run: pnpm --filter @wise2/website type-check

      - name: Test
        run: pnpm --filter @wise2/website test

      - name: Production build
        run: pnpm --filter @wise2/website build
