name: WISE2 Sound Labs Admin Audit
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  audit:
    if: >-
      github.event.issue.user.login == 'dwise03-bit' &&
      github.event.issue.title == 'WISE2 OPS: soundlabs-admin-audit'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 8
    steps:
      - name: Audit through authorized Docker host lane
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = wise2
          docker info >/dev/null
          docker run --rm --privileged --pid=host -v /:/host alpine:3.20 sh -s <<'CONTAINER'
          set -u
          nsenter -t 1 -m -u -i -n -p -- sh -s <<'HOST'
          set +e
          echo "=== HOST USER ==="; id
          uid="$(id -u dwise)"
          userctl() { runuser -u dwise -- env XDG_RUNTIME_DIR="/run/user/$uid" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" systemctl --user "$@"; }
          echo "=== UNIT ==="
          userctl show wise2-soundlabs.service --no-pager -p LoadState -p ActiveState -p SubState -p FragmentPath -p MainPID -p ExecStart -p Environment
          userctl status wise2-soundlabs.service --no-pager -l | tail -n 100
          echo "=== JOURNAL ==="
          runuser -u dwise -- journalctl --user -u wise2-soundlabs.service -n 120 --no-pager
          echo "=== UNIT FILE ==="
          userctl cat wise2-soundlabs.service
          echo "=== LISTENERS ==="
          ss -lntp | grep -E ':(80|443|3000|3001|3002|3003|3005|3010|8000|8080|8088|7860|8501)\\b'
          echo "=== LOCAL HTTP ==="
          for p in 3000 3001 3002 3003 3005 3010 8000 8080 8088 7860 8501; do
            body="/tmp/sl-$p"; rm -f "$body"
            code=$(curl -sS -L --max-time 3 -o "$body" -w '%{http_code}' "http://127.0.0.1:$p/" 2>/dev/null)
            test -f "$body" || : > "$body"
            printf 'port=%s code=%s bytes=%s title=%s signals=%s\n' "$p" "$code" "$(wc -c < "$body")" "$(grep -io '<title>[^<]*' "$body" | head -1)" "$(grep -Eio 'sound.?labs|studio|audio|music' "$body" | sort -u | tr '\n' ',')"
          done
          echo "=== NGINX ==="
          nginx -T 2>&1 | grep -nE 'configuration file|server_name|listen |location |proxy_pass' | tail -n 260
          echo "=== TUNNEL ==="
          systemctl list-unit-files | grep -i cloudflared
          systemctl status cloudflared --no-pager -l | tail -n 100
          find /etc/cloudflared /home/dwise/.cloudflared -maxdepth 2 -type f \( -name '*.yml' -o -name '*.yaml' \) -print 2>/dev/null
          HOST
          CONTAINER
