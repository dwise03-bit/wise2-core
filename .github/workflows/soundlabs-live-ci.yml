name: SoundLabs Live CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'services/soundlabs-live/**'
      - 'apps/studio/app/soundlabs-live/**'
      - 'apps/studio/components/SoundLabsLive/**'
      - 'apps/studio/lib/soundlabs-live-*'
      - 'apps/studio/lib/SoundLabsLiveSync.ts'
      - 'apps/studio/lib/soundlabsLiveStore.ts'
      - 'apps/studio/types/soundlabs-live.ts'
      - 'packages/db/prisma/**'
      - '.github/workflows/soundlabs-live-ci.yml'
  workflow_dispatch:

jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/soundlabs-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/soundlabs-live/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
