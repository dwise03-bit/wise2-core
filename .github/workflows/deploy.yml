name: Deploy WISE² Customer Journey

on:
  push:
    branches: [main, production]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: wise2_test
          POSTGRES_USER: wise2
          POSTGRES_PASSWORD: wise2
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Run linter
        run: pnpm run lint
        continue-on-error: true

      - name: Run tests
        run: pnpm run test
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://wise2:wise2@localhost:5432/wise2_test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'

    steps:
      - uses: actions/checkout@v4

      - name: Validate critical files exist
        run: |
          echo "Checking docker-compose.prod.yml"
          test -f docker-compose.prod.yml || exit 1
          echo "Checking deploy.sh"
          test -f deploy.sh || exit 1
          echo "Checking Dockerfiles"
          test -f Dockerfile.api && test -f Dockerfile.website && test -f Dockerfile.studio || exit 1
          echo "All deployment files present"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'

    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy Customer Journey on home server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            DEPLOY_DIR=/home/dwise/deploy/customer-journey
            CLONE_URL=https://github.com/dwise03-bit/wise2-core.git
            UNIT=customer-journey.service
            HEALTH_URL=http://127.0.0.1:3001/

            mkdir -p "$(dirname "$DEPLOY_DIR")"
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              git clone "$CLONE_URL" "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git fetch origin main
            git reset --hard origin/main

            if systemctl --user list-unit-files --type=service 2>/dev/null | grep -qx "${UNIT}"; then
              systemctl --user restart "$UNIT"
            else
              echo "TODO: create user systemd unit ${UNIT} on the home server for Customer Journey"
              exit 1
            fi

            for attempt in 1 2 3 4 5 6; do
              if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
                echo "Customer Journey health check passed (loopback)"
                exit 0
              fi
              sleep 5
            done
            echo "Customer Journey health check failed on loopback"
            exit 1

      - name: Verify deployment on home server
        uses: appleboy/ssh-action@v1.2.0
        if: success()
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -eu
            curl -fsS http://127.0.0.1:3001/ >/dev/null
            curl -fsS http://127.0.0.1:3010/api/health >/dev/null
            echo "Loopback website and API verification complete"
