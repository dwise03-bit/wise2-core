name: Deploy WISE² Customer Journey

on:
  push:
    branches: [main, production]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: wise2_test
          POSTGRES_USER: wise2
          POSTGRES_PASSWORD: wise2
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint
        continue-on-error: true

      - name: Run tests
        run: pnpm run test
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://wise2:wise2@localhost:5432/wise2_test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push API
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/wise2-api:latest
            ${{ secrets.DOCKER_USERNAME }}/wise2-api:${{ github.sha }}

      - name: Build and push Website
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.website
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/wise2-website:latest
            ${{ secrets.DOCKER_USERNAME }}/wise2-website:${{ github.sha }}

      - name: Build and push Studio
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.studio
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/wise2-studio:latest
            ${{ secrets.DOCKER_USERNAME }}/wise2-studio:${{ github.sha }}

      - name: Build and push Command Center
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./apps/command-center/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_LOGIN_URL=${{ secrets.NEXT_PUBLIC_LOGIN_URL }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/wise2-command-center:latest
            ${{ secrets.DOCKER_USERNAME }}/wise2-command-center:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd wise2-core
            git pull origin ${{ github.ref_name }}
            
            export STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}
            export STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            export STRIPE_STARTER_PRICE_ID=${{ secrets.STRIPE_STARTER_PRICE_ID }}
            export STRIPE_PRO_PRICE_ID=${{ secrets.STRIPE_PRO_PRICE_ID }}
            export STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            export SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
            export SENDGRID_FROM_EMAIL=${{ secrets.SENDGRID_FROM_EMAIL }}
            export DATABASE_URL=${{ secrets.DATABASE_URL }}
            export APP_URL=${{ secrets.APP_URL }}
            export API_BASE_URL=${{ secrets.API_BASE_URL }}
            
            ./deploy.sh production

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'WISE² deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
