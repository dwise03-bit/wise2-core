name: Deploy WISE² Customer Journey

on:
  push:
    branches: [main, production]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: wise2_test
          POSTGRES_USER: wise2
          POSTGRES_PASSWORD: wise2
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint
        continue-on-error: true

      - name: Run tests
        run: pnpm run test
        continue-on-error: true
        env:
          DATABASE_URL: postgresql://wise2:wise2@localhost:5432/wise2_test

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'

    steps:
      - uses: actions/checkout@v4

      - name: Validate critical files exist
        run: |
          echo "✓ Checking docker-compose.prod.yml"
          test -f docker-compose.prod.yml || exit 1
          echo "✓ Checking deploy.sh"
          test -f deploy.sh || exit 1
          echo "✓ Checking Dockerfiles"
          test -f Dockerfile.api && test -f Dockerfile.website && test -f Dockerfile.studio || exit 1
          echo "✓ All deployment files present"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd wise2-core || exit 1

            echo "📋 Fetching latest code..."
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}

            echo "🔐 Setting environment variables..."
            export STRIPE_PUBLIC_KEY=${{ secrets.STRIPE_PUBLIC_KEY }}
            export STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            export STRIPE_STARTER_PRICE_ID=${{ secrets.STRIPE_STARTER_PRICE_ID }}
            export STRIPE_PRO_PRICE_ID=${{ secrets.STRIPE_PRO_PRICE_ID }}
            export STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            export SENDGRID_API_KEY=${{ secrets.SENDGRID_API_KEY }}
            export SENDGRID_FROM_EMAIL=${{ secrets.SENDGRID_FROM_EMAIL }}
            export DATABASE_URL=${{ secrets.DATABASE_URL }}
            export APP_URL=${{ secrets.APP_URL }}
            export API_BASE_URL=${{ secrets.API_BASE_URL }}

            echo "🚀 Starting deployment..."
            chmod +x ./deploy.sh
            ./deploy.sh production || { echo "❌ Deployment failed"; exit 1; }

            echo "✅ Deployment successful"

      - name: Verify deployment
        uses: appleboy/ssh-action@master
        if: success()
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            echo "🏥 Verifying services..."
            cd wise2-core
            docker compose -f docker-compose.prod.yml ps
            echo "✅ Services verification complete"

      - name: Notify Slack on success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: 'success'
          text: '✅ WISE² deployment successful | Commit: ${{ github.sha }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

      - name: Notify Slack on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: 'failure'
          text: '❌ WISE² deployment failed | Commit: ${{ github.sha }} | Branch: ${{ github.ref_name }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
