name: Deploy Prompt Shop to VPS

on:
  push:
    branches: [main]
    paths:
      - 'apps/prompt-shop/**'
      - 'docker-compose.prod.yml'
      - 'nginx.conf'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /home/dwise/wise2-core
            git pull origin main
            docker-compose -f docker-compose.prod.yml build --no-cache prompt-shop
            docker-compose -f docker-compose.prod.yml up -d prompt-shop
            docker-compose -f docker-compose.prod.yml logs prompt-shop | tail -20

      - name: Notify Success
        if: success()
        run: echo "✅ Deployment successful!"

      - name: Notify Failure
        if: failure()
        run: echo "❌ Deployment failed - check logs"
