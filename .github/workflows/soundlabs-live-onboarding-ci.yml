name: SoundLabs Live Onboarding CI
on:
  pull_request:
    branches: [main]
    paths: ['services/soundlabs-live/**']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/soundlabs-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: docker build -t wise2-soundlabs-live:test .
