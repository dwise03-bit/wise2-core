name: WISE2 LLM Tests
on:
  push:
    branches: [feature/wise2-llm-v1]
    paths:
      - 'services/wise2-llm/**'
      - '.github/workflows/wise2-llm-tests.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/wise2-llm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q app.py
      - run: python -m pytest -q tests/
