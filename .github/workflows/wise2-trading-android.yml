name: WISE2 Trading Android

on:
  push:
    branches:
      - feature/wise2-trading-android-v1
    paths:
      - 'apps/wise2-trading-android/**'
      - '.github/workflows/wise2-trading-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests
        working-directory: apps/wise2-trading-android
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        working-directory: apps/wise2-trading-android
        run: gradle assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wise2-trading-debug-apk
          path: apps/wise2-trading-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
