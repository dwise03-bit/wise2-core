name: Field Tech Android

on:
  push:
    branches:
      - main
      - 'feat/fieldtech-*'
    paths:
      - 'apps/fieldtech-android/**'
      - '.github/workflows/fieldtech-android.yml'
  pull_request:
    paths:
      - 'apps/fieldtech-android/**'
      - '.github/workflows/fieldtech-android.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fieldtech-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew lintDebug --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wise2-field-tech-debug-apk
          path: apps/fieldtech-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
