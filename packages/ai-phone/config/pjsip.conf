; WISE² Asterisk PJSIP Configuration
; Twilio BYOC (Bring Your Own Carrier) Setup with Wizard-based Configuration
; Deploy to: /etc/asterisk/pjsip.conf
; Last Updated: 2026-08-24

; ============================================================================
; GLOBAL SETTINGS
; ============================================================================

[global]
debug=yes

; ============================================================================
; SYSTEM DEFAULTS - All new endpoints inherit these settings
; ============================================================================

[system]
type=system
timer_t1=100
timer_t2=100
timer_t4=210
timers_min_se=90
keepalive_interval=90

; ============================================================================
; TRANSPORTS
; ============================================================================

; Transport for Twilio SIP connections (UDP)
[transport-twilio]
type=transport
protocol=udp
bind=0.0.0.0:5060
symmetric_rtp=yes
allow_reload=yes
local_net=127.0.0.1/8
local_net=192.168.0.0/16
local_net=10.0.0.0/8

; Transport for local extensions (TCP/TLS support)
[transport-local]
type=transport
protocol=tcp
bind=0.0.0.0:5061

; ============================================================================
; AUTHENTICATION & CREDENTIALS
; ============================================================================

; Twilio account credentials
[twilio-auth]
type=auth
auth_type=userpass
username=TWILIO_ACCOUNT_SID
password=TWILIO_AUTH_TOKEN

; ============================================================================
; ENDPOINT DEFAULTS
; ============================================================================

[endpoint_defaults](!,)
type=endpoint
context=from-external
allow=!all,ulaw,alaw,gsm,g722,opus
direct_media=no
ice_support=yes
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
rtcp_mux=yes

; ============================================================================
; TWILIO WIZARD CONFIGURATION
; ============================================================================

; Master wizard template for Twilio
[twilio_wizard](!,peer_defaults)
type=wizard
sends_registrations=yes
sends_line_number=yes
username=TWILIO_ACCOUNT_SID
password=TWILIO_AUTH_TOKEN
endpoint/context=from-twilio
aor/max_contacts=1
endpoint/allow=!all,ulaw,alaw,gsm,g722,opus
endpoint/direct_media=no
endpoint/ice_support=yes
endpoint/force_rport=yes
endpoint/rewrite_contact=yes
endpoint/rtp_symmetric=yes

; ============================================================================
; REGISTRATION - TWILIO OUTBOUND
; ============================================================================

; Twilio Outbound Registration (BYOC)
[twilio-registration]
type=registration
outbound_auth=twilio-auth
server_uri=sip:sip-us1.twilio.com
client_uri=sip:TWILIO_ACCOUNT_SID@sip-us1.twilio.com
contact_user=TWILIO_ACCOUNT_SID
transport=transport-twilio
retry_interval=60
forbidden_retry_interval=600
expiration=3600
line=yes

; ============================================================================
; AOR - ADDRESS OF RECORD (Twilio Registration Target)
; ============================================================================

[twilio-aor]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=60
qualify_timeout=3

; ============================================================================
; ENDPOINT - Twilio Inbound Handler
; ============================================================================

[twilio-endpoint]
type=endpoint
aors=twilio-aor
auth=twilio-auth
outbound_auth=twilio-auth
context=from-twilio
transport=transport-twilio
from_domain=sip-us1.twilio.com
allow=!all,ulaw,alaw,gsm,g722,opus
direct_media=no
ice_support=yes
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
rtcp_mux=yes
tos_audio=EF
tos_video=AF41
cos_audio=5
cos_video=4
dtmf_mode=auto
allow_transfer=yes
send_rpid=yes
send_pai=yes
connected_line_method=single_task
connected_line_send_on_answer=yes

; ============================================================================
; CONTEXT - Twilio Inbound Call Routing
; ============================================================================

[from-twilio]
exten => _+1XXXXXXXXXX,1,NoOp(Twilio inbound call from ${CALLERID(num)})
 same => n,Set(CHANNEL(language)=en)
 same => n,Dial(Local/${EXTEN:1}@from-internal,20,b(answer^s^1))
 same => n,Voicemail(${EXTEN:1}@default)
 same => n,Hangup()

; Route to AI receptionist
exten => s,1,NoOp(Routing to AI receptionist)
 same => n,Answer()
 same => n,AGI(agi://127.0.0.1:4573/ai-receptionist)
 same => n,Hangup()

; ============================================================================
; DIALPLAN - Internal Extensions
; ============================================================================

[from-internal]
exten => _X.,1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(SIP/${EXTEN},30)
 same => n,Voicemail(${EXTEN}@default)
 same => n,Hangup()

; ============================================================================
; ACL - Access Control Lists
; ============================================================================

[acl_twilio]
type=acl
deny=0.0.0.0/0.0.0.0
permit=54.172.60.0/22
permit=54.244.51.0/24
permit=54.255.167.0/24
permit=54.252.254.0/24
permit=177.71.206.0/24
permit=195.14.235.0/24
permit=199.101.136.0/24
permit=203.113.98.0/24
permit=54.65.63.0/24
permit=54.199.138.0/24
permit=54.150.162.0/24
permit=54.168.67.0/24
permit=54.248.220.0/24
permit=54.92.60.0/24
permit=54.84.124.0/24
permit=54.160.191.0/24
permit=54.173.168.0/24

; ============================================================================
; NOTE: Configuration Variables to Replace
; ============================================================================
; Replace the following with actual values:
;
; TWILIO_ACCOUNT_SID — Your Twilio Account SID from console.twilio.com
; TWILIO_AUTH_TOKEN — Your Twilio Auth Token (keep secure!)
;
; After replacement, reload Asterisk:
;   asterisk -rx "core reload"
;
; Verify registration:
;   asterisk -rx "pjsip show registrations"
;
; ============================================================================
