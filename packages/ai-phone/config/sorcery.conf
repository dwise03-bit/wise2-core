; WISE² Asterisk Sorcery Configuration
; Maps PJSIP objects to configuration providers
; Deploy to: /etc/asterisk/sorcery.conf
; Last Updated: 2026-08-24

; ============================================================================
; SORCERY OBJECT MAPPING
; ============================================================================
; Maps PJSIP objects to their configuration sources.
; This is critical for Asterisk to find and load outbound registrations.
;
; Format:
;   [object_type]=wizard,name,criteria=type=object_type
;
; The criteria tells Asterisk which sections in pjsip.conf to load as
; instances of this object type.

[res_pjsip]

; ---- ENDPOINTS ----
; SIP endpoints (devices/users that connect to Asterisk)
endpoint=config,pjsip.conf,criteria=type=endpoint

; ---- ADDRESSES OF RECORD (AOR) ----
; Maps contact URIs to endpoints (where devices register)
aor=config,pjsip.conf,criteria=type=aor

; ---- AUTHENTICATION ----
; Credentials for inbound/outbound authentication
auth=config,pjsip.conf,criteria=type=auth

; ---- TRANSPORTS ----
; Network transports for SIP (UDP, TCP, TLS, WebSocket, etc.)
transport=config,pjsip.conf,criteria=type=transport

; ---- REGISTRATIONS (CRITICAL FOR TWILIO) ----
; **THIS IS THE KEY MAPPING FOR TWILIO BYOC**
; Tells Asterisk where to find outbound registration configs.
; When Asterisk starts, it looks for sections with type=registration
; and loads them as outbound registrations.
registration=config,pjsip.conf,criteria=type=registration

; ---- DOMAIN ALIASES ----
; Maps domain names to endpoints/contexts
domain_alias=config,pjsip.conf,criteria=type=domain_alias

; ---- GLOBAL CONFIG ----
; System-wide PJSIP settings
system=config,pjsip.conf,criteria=type=system

; ---- OUTBOUND PROXIES ----
; For routing outbound requests through proxies
outbound_proxy=config,pjsip.conf,criteria=type=outbound_proxy

; ---- ACL (Access Control Lists) ----
; IP-based access control for security
acl=config,pjsip.conf,criteria=type=acl

; ============================================================================
; RES_PJSIP_PHONEPROV (Optional: Phone Provisioning)
; ============================================================================
; If you use phone auto-provisioning:
;
; [res_pjsip_phoneprov]
; phoneprov=config,pjsip_phoneprov.conf
;
; Uncomment above if deploying SIP phone provisioning.

; ============================================================================
; MEMORY CACHE CONFIGURATION (Optional Performance Tuning)
; ============================================================================
; For high-volume deployments, cache PJSIP objects in memory:
;
; [res_pjsip_with_cache]
; endpoint=memory,pjsip.conf,criteria=type=endpoint
; aor=memory,pjsip.conf,criteria=type=aor
; auth=memory,pjsip.conf,criteria=type=auth
; registration=memory,pjsip.conf,criteria=type=registration
;
; Set populate_cache=yes in [global] to pre-load all objects on startup.

; ============================================================================
; VERIFICATION CHECKLIST
; ============================================================================
; After configuring sorcery:
;
; 1. Ensure pjsip.conf exists at /etc/asterisk/pjsip.conf
; 2. Ensure this file exists at /etc/asterisk/sorcery.conf
; 3. In pjsip.conf, create a [twilio-registration] section with:
;    - type=registration
;    - server_uri=sip:sip-us1.twilio.com
;    - client_uri=sip:TWILIO_ACCOUNT_SID@sip-us1.twilio.com
;    - transport=transport-twilio
;    - outbound_auth=twilio-auth
; 4. Restart Asterisk: sudo systemctl restart asterisk
; 5. Verify registration loads: asterisk -rx "pjsip show registrations"
;
; If registration doesn't appear, check:
;    asterisk -rvvv
;    core set verbose 3
;    core set debug 3
;    # Tail logs and watch for load errors
;
; ============================================================================

; ============================================================================
; TROUBLESHOOTING: REGISTRATION NOT APPEARING
; ============================================================================
;
; If "pjsip show registrations" shows no registrations:
;
; 1. CHECK SORCERY MAPPING
;    Ensure registration=config,pjsip.conf,criteria=type=registration exists above
;
; 2. CHECK PJSIP.CONF SYNTAX
;    Run: asterisk -rx "config validate pjsip.conf"
;
; 3. CHECK FOR TYPOS
;    - Ensure [registration] section has type=registration
;    - Ensure section name is correct
;
; 4. RELOAD ASTERISK
;    asterisk -rx "core reload"
;    (NOT just "pjsip reload" — that may not reload sorcery mappings)
;
; 5. CHECK LOGS
;    sudo tail -100 /var/log/asterisk/messages.log | grep -i registration
;    sudo tail -100 /var/log/asterisk/messages.log | grep -i sorcery
;
; 6. ENABLE DEBUG
;    asterisk -rvvv
;    core set verbose 3
;    core set debug 3
;    # Restart Asterisk and watch debug output
;
; ============================================================================
