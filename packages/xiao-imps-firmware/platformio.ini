[env:seeed_xiao_esp32s3]
platform = espressif32@6.5.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 57600

; Compiler flags
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -O2
    -DARDUINO_XIAO_ESP32S3=1

; Include paths
build_includes =
    ${PROJECT_DIR}/src

; Libraries
lib_deps =
    ; No external audio libraries; using ESP32 IDF I2S directly
    ; This reduces memory footprint and ensures compatibility

; Monitor filter for debug output
monitor_filters = esp32_exception_decoder

; Upload protocol
upload_protocol = esptool

; Memory settings
board_build.memory_type = qio_opi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; Default partition scheme
