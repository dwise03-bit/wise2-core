# WISE² Stable Production Compose
# Core services only (postgres, redis, api, website)
# All services have restart: unless-stopped for automatic recovery
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: wise2-db
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: wise2_prod
      POSTGRES_USER: wise2
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-wise2}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - wise2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wise2 -d wise2_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: wise2-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wise2
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS API
  api:
    image: wise2-core-api:latest
    container_name: wise2-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgresql://wise2:wise2@postgres:5432/wise2_prod
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CLOUD_STARTER_PRICE_ID: ${STRIPE_CLOUD_STARTER_PRICE_ID}
      STRIPE_CLOUD_BUSINESS_PRICE_ID: ${STRIPE_CLOUD_BUSINESS_PRICE_ID}
      STRIPE_CLOUD_PRO_PRICE_ID: ${STRIPE_CLOUD_PRO_PRICE_ID}
      STRIPE_STARTER_PRICE_ID: ${STRIPE_STARTER_PRICE_ID}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID}
      TWENTYI_API_KEY: ${TWENTYI_API_KEY}
      TWENTYI_API_BASE_URL: ${TWENTYI_API_BASE_URL:-https://api.20i.com/}
      TWENTYI_PACKAGE_TYPE_STARTER: ${TWENTYI_PACKAGE_TYPE_STARTER}
      TWENTYI_PACKAGE_TYPE_BUSINESS: ${TWENTYI_PACKAGE_TYPE_BUSINESS}
      TWENTYI_PACKAGE_TYPE_PRO: ${TWENTYI_PACKAGE_TYPE_PRO}
      TWENTYI_PACKAGE_LABEL_STARTER: ${TWENTYI_PACKAGE_LABEL_STARTER:-Starter}
      TWENTYI_PACKAGE_LABEL_BUSINESS: ${TWENTYI_PACKAGE_LABEL_BUSINESS:-Business}
      TWENTYI_PACKAGE_LABEL_PRO: ${TWENTYI_PACKAGE_LABEL_PRO:-Pro}
      CLOUD_STOREFRONT_LIVE: ${CLOUD_STOREFRONT_LIVE:-false}
      # Email is optional and must not block unrelated production services.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      APP_URL: ${APP_URL}
      API_BASE_URL: ${API_BASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://wise2.net,https://www.wise2.net,https://api.wise2.net,https://cloud.wise2.net}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL_API:-https://api.wise2.net/api/v1/auth/google/callback}
      NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:-https://wise2.net}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_BOT_CLIENT_ID:-1512638268225622147}
      DISCORD_OAUTH_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_OAUTH_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://172.17.0.1:11435}
      HERMES_ENDPOINT: ${HERMES_ENDPOINT:-http://172.17.0.1:11435/v1/chat/completions}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-mistral:latest}
      HERMES_TIMEOUT_MS: ${HERMES_TIMEOUT_MS:-90000}
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wise2
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Website
  website:
    image: wise2-core-website:latest
    container_name: wise2-website
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.wise2.net}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_OAUTH_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_OAUTH_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-https://wise2.net/api/auth/discord/callback}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI_WEBSITE:-https://wise2.net/api/auth/google/callback}
      API_INTERNAL_URL: http://api:3000/api
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://wise2.net}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://172.17.0.1:11435}
      HERMES_ENDPOINT: ${HERMES_ENDPOINT:-http://172.17.0.1:11435/v1/chat/completions}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-mistral:latest}
      OLLAMA_GRAPHICS_MODEL: ${OLLAMA_GRAPHICS_MODEL:-mistral:latest}
      GRAPHICS_OUTPUT_DIR: /app/data/graphics
      OWNER_EMAIL: ${OWNER_EMAIL:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - graphics_data:/app/data/graphics
    depends_on:
      - api
    networks:
      - wise2
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  graphics_data:
    driver: local

networks:
  wise2:
    external: true
    name: wise2-net
