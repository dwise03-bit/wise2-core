name: Deploy WISE²

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy-vps:
    runs-on: ubuntu-latest
    name: Deploy to VPS (gpu-nmls)
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.VPS_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_rsa dwise@100.68.145.5 << 'EOF'
          cd /home/dwise/wise2-core
          git pull origin main
          docker-compose -f docker-compose.prod.yml up -d
          docker-compose logs --tail=20
          EOF

      - name: Notify deployment
        if: success()
        run: echo "✅ Deployment successful to gpu-nmls"

  deploy-surface:
    runs-on: ubuntu-latest
    name: Deploy to TV Hub (wise2-surface)
    needs: deploy-vps
    steps:
      - uses: actions/checkout@v4

      - name: Set up Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}

      - name: Deploy to Surface TV
        run: |
          ssh -i ~/.ssh/id_rsa dwise@100.97.230.73 << 'EOF'
          cd /home/wise2/wise2-core
          git pull origin main
          npm run build
          systemctl restart wise2-display
          EOF

  notify-team:
    runs-on: ubuntu-latest
    name: Notify Team
    needs: [deploy-vps, deploy-surface]
    if: always()
    steps:
      - name: Send Slack notification
        run: |
          echo "Deployment completed for WISE² Core"
