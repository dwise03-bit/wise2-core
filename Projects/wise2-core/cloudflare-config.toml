# WISE² Cloudflare Configuration
# Managed zone: wise2.net

[zone]
name = "wise2.net"
type = "full"

[dns_records]
# Main API
[[dns_records.records]]
name = "api"
type = "A"
content = "100.68.145.5"
ttl = 300
proxied = true
comment = "WISE² API - gpu-nmls VPS"

# Website
[[dns_records.records]]
name = "wise2"
type = "A"
content = "100.68.145.5"
ttl = 300
proxied = true
comment = "WISE² Website"

# Dashboard
[[dns_records.records]]
name = "dashboard"
type = "CNAME"
content = "wise2.net"
ttl = 300
proxied = true
comment = "WISE² Dashboard"

# Tailscale Magic DNS
[[dns_records.records]]
name = "ts.wise2.net"
type = "TXT"
content = "v=tailscale"
ttl = 300
comment = "Tailscale verification"

# VPS Server
[[dns_records.records]]
name = "gpu-nmls"
type = "A"
content = "100.68.145.5"
ttl = 300
proxied = false
comment = "VPS Direct Access"

# TV Hub
[[dns_records.records]]
name = "display"
type = "A"
content = "100.97.230.73"
ttl = 300
proxied = false
comment = "TV Hub / wise2-surface"

[page_rules]
# Cache assets
[[page_rules.rules]]
targets = ["api.wise2.net/assets/*"]
actions = [{id = "cache_level", value = "cache_everything"}]
priority = 1

# API endpoints - no cache
[[page_rules.rules]]
targets = ["api.wise2.net/v1/*"]
actions = [{id = "cache_level", value = "bypass"}]
priority = 2

[waf_rules]
# Enable challenge for suspicious traffic
mode = "challenge"

[ssl_tls]
minimum_tls_version = "1.2"
ssl_profile = "flexible"

[security]
ddos_protection = true
brotli_compression = true
auto_minify = {
  js = true,
  css = true,
  html = true
}
