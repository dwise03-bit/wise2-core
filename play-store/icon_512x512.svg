<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      :root {
        --black: #0a0e1a;
        --charcoal: #1a1f2e;
        --gunmetal: #2d3142;
        --blue: #00d4ff;
        --red: #d63031;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#0a0e1a"/>

  <!-- Outer frame: gunmetal rounded square -->
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="#2d3142" stroke-width="8"/>

  <!-- Inner technical border -->
  <rect x="40" y="40" width="432" height="432" rx="60" fill="#1a1f2e"/>

  <!-- Central HUD circle with crosshairs -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.8"/>

  <!-- Crosshair horizontal -->
  <line x1="120" y1="256" x2="180" y2="256" stroke="#00d4ff" stroke-width="2"/>
  <line x1="332" y1="256" x2="392" y2="256" stroke="#00d4ff" stroke-width="2"/>

  <!-- Crosshair vertical -->
  <line x1="256" y1="120" x2="256" y2="180" stroke="#00d4ff" stroke-width="2"/>
  <line x1="256" y1="332" x2="256" y2="392" stroke="#00d4ff" stroke-width="2"/>

  <!-- Center dot -->
  <circle cx="256" cy="256" r="8" fill="#00d4ff"/>

  <!-- W² symbol (stylized) -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#00d4ff" text-anchor="middle">W²</text>

  <!-- Field indicator dots (red at corners) -->
  <circle cx="100" cy="100" r="4" fill="#d63031" opacity="0.7"/>
  <circle cx="412" cy="100" r="4" fill="#d63031" opacity="0.7"/>
  <circle cx="100" cy="412" r="4" fill="#d63031" opacity="0.7"/>
  <circle cx="412" cy="412" r="4" fill="#d63031" opacity="0.7"/>
</svg>
