version: '3.9'

services:
  api:
    image: node:18-alpine
    container_name: wise2-api
    ports:
      - "3010:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
    volumes:
      - ./dist:/app/dist
    working_dir: /app
    command: node dist/server.js
    restart: always

  db:
    image: postgres:15-alpine
    container_name: wise2-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wise2_db
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: wise2-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

volumes:
  db_data:
  ollama_data:
