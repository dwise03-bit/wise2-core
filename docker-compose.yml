version: '3.9'

services:
  api:
    image: node:18-alpine
    container_name: wise2-api
    ports:
      - "3010:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
    volumes:
      - ./dist:/app/dist
    working_dir: /app
    command: node dist/server.js
    restart: always

  db:
    image: postgres:15-alpine
    container_name: wise2-db
    ports:
      - "5432:5432"
    networks:
      - wise2-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wise2_db
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wise2-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - wise2-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  mongodb:
    image: mongo:7
    container_name: wise2-mongodb

  ollama:
    image: ollama/ollama:latest
    container_name: wise2-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

volumes:
  db_data:
  redis_data:
  ollama_data:
