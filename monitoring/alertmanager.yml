# Alertmanager configuration for WISE² AR/VR

global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 0s
      repeat_interval: 1h

    # Warning alerts - regular notification
    - match:
        severity: warning
      receiver: 'warning'
      group_wait: 30s
      repeat_interval: 4h

    # Info alerts - daily digest
    - match:
        severity: info
      receiver: 'info'
      group_wait: 10m
      repeat_interval: 24h

    # SLA breaches - immediate critical alert
    - match:
        sla: '99.9%'
      receiver: 'sla-critical'
      group_wait: 0s
      repeat_interval: 30m

receivers:
  # Default receiver
  - name: 'default'
    slack_configs:
      - channel: '#wise2-monitoring'
        title: 'Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'

  # Critical alerts - ping team immediately
  - name: 'critical'
    slack_configs:
      - channel: '#wise2-critical-alerts'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'danger'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .GroupLabels.alertname }}'
        client: 'WISE² Monitoring'
        details:
          firing: '{{ range .Alerts.Firing }}{{ .Labels.instance }}\n{{ end }}'

  # Warning alerts
  - name: 'warning'
    slack_configs:
      - channel: '#wise2-monitoring'
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'warning'

  # Info alerts - low priority
  - name: 'info'
    slack_configs:
      - channel: '#wise2-monitoring-info'
        title: 'ℹ️ INFO: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: false
        color: 'good'

  # SLA breaches - all hands on deck
  - name: 'sla-critical'
    slack_configs:
      - channel: '#wise2-critical-alerts'
        title: '🚨🚨 SLA BREACH: {{ .GroupLabels.alertname }}'
        text: '@channel SLA Breach!\n{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
        color: 'danger'
      - channel: '@dwise03'  # Direct message to owner
        title: 'SLA Breach Detected'
        text: 'Check #wise2-critical-alerts for details'
        color: 'danger'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: 'SLA BREACH: {{ .GroupLabels.alertname }}'
        details:
          severity: 'SEV1'
          impact: 'Production service degradation'

inhibit_rules:
  # Suppress warnings if the service is already down
  - source_match:
      severity: 'critical'
    target_match_re:
      severity: 'warning|info'
    equal: ['service', 'alertname']

  # Suppress latency warnings if the service is down
  - source_match:
      alertname: 'RouterDown'
    target_match:
      alertname: 'HighLatency'
    equal: ['service']

  # Suppress memory warnings if the service is already critical
  - source_match:
      alertname: 'OllamaMemoryHigh'
    target_match:
      severity: 'warning'
    equal: ['service']
