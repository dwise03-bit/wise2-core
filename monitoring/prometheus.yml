# Prometheus configuration for WISE² AR/VR monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'wise2-ar-vr'
    environment: 'production'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

# Load rules
rule_files:
  - 'alerts.yml'

scrape_configs:
  # Router service
  - job_name: 'wise2-router'
    static_configs:
      - targets: ['localhost:3100']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Ollama inference engine
  - job_name: 'ollama'
    static_configs:
      - targets: ['localhost:11434']
    metrics_path: '/api/metrics'
    scrape_interval: 30s

  # Second Brain knowledge system
  - job_name: 'second-brain'
    static_configs:
      - targets: ['localhost:3012']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # PostgreSQL database
  - job_name: 'postgres'
    static_configs:
      - targets: ['localhost:9187']
    scrape_interval: 15s

  # Redis cache
  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:9121']
    scrape_interval: 15s

  # Node exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
    scrape_interval: 15s
