version: '3.8'

services:
  musicgen-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musicgen-service
    restart: unless-stopped

    # GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # Environment
    environment:
      - MUSICGEN_HOST=0.0.0.0
      - MUSICGEN_PORT=5000
      - DEVICE=cuda
      - USE_FP16=true
      - DEBUG=false
      - GUNICORN_WORKERS=2

    # Ports
    ports:
      - "5000:5000"

    # Volumes for model cache and persistent data
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./cache:/app/cache

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Resource limits
    mem_limit: 16g
    cpus: "4"

networks:
  default:
    name: wise2-network
    driver: bridge
