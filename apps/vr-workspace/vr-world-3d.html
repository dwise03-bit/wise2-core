<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WISE² VR World - Quest 3S</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00d9ff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #00d9ff;
            max-width: 300px;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
            z-index: 10;
        }

        #hand-indicator {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            font-size: 12px;
            z-index: 10;
        }

        .hand-status {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #6366f1;
            text-align: center;
        }

        .hand-status.active {
            border-color: #00ff7f;
            color: #00ff7f;
        }

        #fps-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #d97706;
            font-family: 'Courier New', monospace;
            color: #d97706;
            z-index: 10;
        }

        #equipment-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #00ff7f;
            max-width: 320px;
            font-size: 13px;
            color: #00d9ff;
            z-index: 10;
            display: none;
        }

        #equipment-info.visible {
            display: block;
        }

        .severity {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 5px;
        }

        .severity.critical {
            background: rgba(220, 38, 38, 0.3);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }

        .severity.warning {
            background: rgba(217, 119, 6, 0.3);
            color: #fbbf24;
            border: 1px solid #fbbf24;
        }

        .severity.info {
            background: rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
            border: 1px solid #6ee7b7;
        }

        #instructions {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 30px;
            border-radius: 10px;
            border: 2px solid #00ff7f;
            color: #00ff7f;
            text-align: center;
            max-width: 500px;
            font-size: 14px;
            z-index: 10;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #00d9ff;
            font-size: 18px;
            z-index: 20;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #00d9ff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div>Initializing 3D Job Site...</div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="ui-overlay">
        <div><strong>🎮 WISE² VR Workspace</strong></div>
        <div style="margin-top: 8px; font-size: 12px;">
            <div>Status: <span style="color: #00ff7f;">ACTIVE</span></div>
            <div>Mode: <span style="color: #fbbf24;">Equipment Analysis</span></div>
            <div>Devices: <span style="color: #00d9ff;">2 Connected</span></div>
        </div>
    </div>

    <div id="fps-counter">FPS: 72</div>

    <div id="hand-indicator">
        <div class="hand-status">
            <div>👈 Left Hand</div>
            <div style="font-size: 10px; color: #888;">Ready</div>
        </div>
        <div class="hand-status">
            <div>👉 Right Hand</div>
            <div style="font-size: 10px; color: #888;">Ready</div>
        </div>
    </div>

    <div id="equipment-info">
        <div id="eq-name"><strong>Equipment</strong></div>
        <div id="eq-details" style="margin-top: 8px; font-size: 11px; color: #c0c0c0;"></div>
        <div id="eq-severity" class="severity"></div>
    </div>

    <div id="instructions">
        <div>👉 <strong>Click equipment</strong> to analyze</div>
        <div style="font-size: 12px; color: #aaa; margin-top: 5px;">Move mouse to aim, click to interact</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        class VRWorld {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.equipment = [];
                this.selectedEquipment = null;
                this.frameCount = 0;
                this.lastTime = Date.now();
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
            }

            init() {
                // Scene
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0f1419);
                this.scene.fog = new THREE.Fog(0x0f1419, 100, 500);

                // Camera positioned to see equipment
                this.camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    2000
                );
                this.camera.position.set(0, 2, 6);
                this.camera.lookAt(0, 1, 0);

                // Renderer
                this.renderer = new THREE.WebGLRenderer({
                    canvas: document.getElementById('canvas'),
                    antialias: true,
                    alpha: false
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.shadowMap.enabled = true;

                // Lighting - VERY BRIGHT
                this.setupLighting();

                // Floor
                this.createFloor();

                // Equipment
                this.createEquipment();

                // Remove loading
                document.getElementById('loading').style.display = 'none';

                // Animation loop
                this.animate();

                // Event listeners
                window.addEventListener('resize', () => this.onWindowResize());
                window.addEventListener('click', (e) => this.onInteract(e));
                window.addEventListener('mousemove', (e) => this.onMouseMove(e));
            }

            setupLighting() {
                // Very bright ambient
                const ambient = new THREE.AmbientLight(0xffffff, 1.5);
                this.scene.add(ambient);

                // Main directional light
                const dir = new THREE.DirectionalLight(0xffffff, 1.5);
                dir.position.set(5, 8, 5);
                dir.castShadow = true;
                this.scene.add(dir);

                // Cyan light
                const cyan = new THREE.PointLight(0x00d9ff, 1.5);
                cyan.position.set(-5, 3, 5);
                this.scene.add(cyan);

                // Green light
                const green = new THREE.PointLight(0x00ff7f, 1.5);
                green.position.set(5, 3, -5);
                this.scene.add(green);
            }

            createFloor() {
                const floor = new THREE.Mesh(
                    new THREE.PlaneGeometry(20, 20),
                    new THREE.MeshPhongMaterial({
                        color: 0x333333,
                        side: THREE.DoubleSide
                    })
                );
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = 0;
                floor.receiveShadow = true;
                this.scene.add(floor);

                // Grid
                const grid = new THREE.GridHelper(20, 20, 0x00d9ff, 0x1a3a3a);
                grid.position.y = 0.01;
                this.scene.add(grid);
            }

            createEquipment() {
                // HVAC Unit - BLUE, LARGE, CENTER LEFT
                const hvac = new THREE.Group();
                hvac.position.set(-3, 1, 0);

                const hvacBox = new THREE.Mesh(
                    new THREE.BoxGeometry(2, 2, 1.2),
                    new THREE.MeshPhongMaterial({
                        color: 0x4a90e2,
                        emissive: 0x1a4da2,
                        shininess: 100
                    })
                );
                hvacBox.castShadow = true;
                hvacBox.receiveShadow = true;
                hvac.add(hvacBox);

                // Label
                const hvacLabel = new THREE.Mesh(
                    new THREE.PlaneGeometry(2, 0.4),
                    new THREE.MeshBasicMaterial({ color: 0x00d9ff })
                );
                hvacLabel.position.z = 0.61;
                hvac.add(hvacLabel);

                hvac.userData = {
                    name: 'HVAC Unit 5000X',
                    severity: 'critical',
                    diagnosis: 'Compressor efficiency 75%',
                    parts: ['Refrigerant', 'Valve', 'Capacitor'],
                    time: '2.5 hrs'
                };

                this.scene.add(hvac);
                this.equipment.push(hvac);

                // ELECTRICAL PANEL - ORANGE, CENTER RIGHT
                const panel = new THREE.Group();
                panel.position.set(3, 1.2, 0);

                const panelBox = new THREE.Mesh(
                    new THREE.BoxGeometry(1, 2.5, 0.3),
                    new THREE.MeshPhongMaterial({
                        color: 0xd97706,
                        emissive: 0x7a4200,
                        shininess: 80
                    })
                );
                panelBox.castShadow = true;
                panelBox.receiveShadow = true;
                panel.add(panelBox);

                // Breakers
                for (let i = 0; i < 6; i++) {
                    const breaker = new THREE.Mesh(
                        new THREE.BoxGeometry(0.25, 0.25, 0.15),
                        new THREE.MeshPhongMaterial({
                            color: 0xff6b6b,
                            emissive: 0xaa0000
                        })
                    );
                    breaker.position.set(-0.2, 0.8 - i * 0.35, 0.2);
                    breaker.castShadow = true;
                    panel.add(breaker);
                }

                panel.userData = {
                    name: 'Electrical Panel',
                    severity: 'warning',
                    diagnosis: 'Main breaker at 85% capacity',
                    parts: ['10A breaker', 'Disconnect switch'],
                    time: '1.5 hrs'
                };

                this.scene.add(panel);
                this.equipment.push(panel);

                // WATER HEATER - CYAN, RIGHT SIDE
                const heater = new THREE.Group();
                heater.position.set(0, 0.9, 3);

                const heaterCyl = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.5, 0.5, 1.5, 32),
                    new THREE.MeshPhongMaterial({
                        color: 0x6ee7b7,
                        emissive: 0x2a7a66,
                        shininess: 90
                    })
                );
                heaterCyl.castShadow = true;
                heaterCyl.receiveShadow = true;
                heater.add(heaterCyl);

                heater.userData = {
                    name: 'Water Heater',
                    severity: 'info',
                    diagnosis: 'Operating normally, 85% efficiency',
                    parts: ['Anode rod', 'Thermostat'],
                    time: '0.5 hrs'
                };

                this.scene.add(heater);
                this.equipment.push(heater);
            }

            onMouseMove(event) {
                this.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                this.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                // Raycast
                this.raycaster.setFromCamera(this.mouse, this.camera);
                const intersects = this.raycaster.intersectObjects(this.equipment, true);

                if (intersects.length > 0) {
                    const obj = intersects[0].object;
                    let equipment = null;

                    for (let eq of this.equipment) {
                        if (eq.children.includes(obj) || eq === obj) {
                            equipment = eq;
                            break;
                        }
                    }

                    if (equipment) {
                        this.showEquipmentInfo(equipment);
                    }
                }
            }

            onInteract(event) {
                this.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                this.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                this.raycaster.setFromCamera(this.mouse, this.camera);
                const intersects = this.raycaster.intersectObjects(this.equipment, true);

                if (intersects.length > 0) {
                    const obj = intersects[0].object;
                    for (let eq of this.equipment) {
                        if (eq.children.includes(obj) || eq === obj) {
                            this.selectEquipment(eq);
                            break;
                        }
                    }
                }
            }

            showEquipmentInfo(equipment) {
                const data = equipment.userData;
                const infoDiv = document.getElementById('equipment-info');
                const nameDiv = document.getElementById('eq-name');
                const detailsDiv = document.getElementById('eq-details');
                const severityDiv = document.getElementById('eq-severity');

                nameDiv.innerHTML = `<strong>${data.name}</strong>`;
                detailsDiv.innerHTML = `
                    <div>📋 Diagnosis: ${data.diagnosis}</div>
                    <div style="margin-top: 5px;">🔧 Parts: ${data.parts.join(', ')}</div>
                    <div style="margin-top: 5px;">⏱️ Time: ${data.time}</div>
                `;
                severityDiv.className = `severity ${data.severity}`;
                severityDiv.textContent = `[${data.severity.toUpperCase()}]`;

                infoDiv.classList.add('visible');
            }

            selectEquipment(equipment) {
                if (this.selectedEquipment) {
                    this.selectedEquipment.children[0].material.emissive.setHex(
                        this.selectedEquipment.userData.severity === 'critical' ? 0x1a4da2 :
                        this.selectedEquipment.userData.severity === 'warning' ? 0x7a4200 :
                        0x2a7a66
                    );
                }
                this.selectedEquipment = equipment;
                equipment.children[0].material.emissive.setHex(0xffff00);
                this.showEquipmentInfo(equipment);
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                this.frameCount++;
                const now = Date.now();
                if (now - this.lastTime >= 1000) {
                    document.getElementById('fps-counter').textContent = `FPS: ${this.frameCount}`;
                    this.frameCount = 0;
                    this.lastTime = now;
                }

                this.renderer.render(this.scene, this.camera);
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        const vr = new VRWorld();
        vr.init();
    </script>
</body>
</html>
