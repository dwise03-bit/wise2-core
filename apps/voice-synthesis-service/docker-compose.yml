version: "3.9"

services:
  voice-synthesis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-synthesis-service
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - CONFIG_PATH=/app/config/production.yaml
      - DEVICE=cpu  # Set to 'cuda' if GPU available
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./output:/app/output
      - ./logs:/app/logs
      - ./config:/app/config
    restart: unless-stopped
    networks:
      - wise2-network

  # Optional: Redis cache for synthesis results
  redis:
    image: redis:7-alpine
    container_name: voice-synthesis-cache
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - wise2-network

networks:
  wise2-network:
    external: false
