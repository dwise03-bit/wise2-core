<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" fill="#050607"/>

  <!-- Gold border -->
  <rect width="192" height="192" fill="none" stroke="#C4A369" stroke-width="4"/>

  <!-- Gradient overlay -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#C4A369;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#050607;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C4A369"/>
      <stop offset="100%" style="stop-color:#00D9FF"/>
    </linearGradient>
  </defs>

  <!-- Glow -->
  <rect width="192" height="192" fill="url(#glow)"/>

  <!-- Main text "BH" -->
  <text x="96" y="110" font-size="72" font-weight="900" font-family="sans-serif" text-anchor="middle" fill="url(#textGrad)" letter-spacing="4">BH</text>

  <!-- Subtitle -->
  <text x="96" y="135" font-size="11" font-weight="600" font-family="sans-serif" text-anchor="middle" fill="#C4A369" letter-spacing="2">BLAKK HAIL</text>

  <!-- Accent line -->
  <line x1="48" y1="145" x2="144" y2="145" stroke="#00D9FF" stroke-width="2"/>

  <!-- Corner accents -->
  <circle cx="15" cy="15" r="3" fill="#C4A369"/>
  <circle cx="177" cy="15" r="3" fill="#C4A369"/>
  <circle cx="15" cy="177" r="3" fill="#C4A369"/>
  <circle cx="177" cy="177" r="3" fill="#C4A369"/>
</svg>
