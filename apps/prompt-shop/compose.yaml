name: wise-touch
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wise_touch}
      POSTGRES_USER: ${POSTGRES_USER:-wise_touch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [backend]

  app:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgresql://${POSTGRES_USER:-wise_touch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wise_touch}
    depends_on:
      db:
        condition: service_healthy
        restart: true
    read_only: true
    tmpfs: [/tmp]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - generated_images:/app/generated
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [backend, edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    networks: [edge]

networks:
  backend:
    internal: true
  edge:
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  generated_images:
