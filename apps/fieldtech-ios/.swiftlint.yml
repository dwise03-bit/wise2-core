# WISE² SwiftLint config — Phase 4 OSS Toolkit
#
# ** PATH NOTE ** Generated at apps/fieldtech-ios (the path requested by the task).
# The actual Swift source for the FieldTech app lives at apps/wise-hvac-demo/ios/App/App/
# (see apps/fieldtech-ios/maestro.yml for the same mismatch). Copy or symlink this file
# there before running `swiftlint` for real:
#   cp apps/fieldtech-ios/.swiftlint.yml apps/wise-hvac-demo/ios/.swiftlint.yml
# apps/wise2-ios (Command Center, unrelated app) should get its own copy of this file
# at apps/wise2-ios/.swiftlint.yml if lint is desired there too.

included:
  - Sources
  - App

excluded:
  - Pods
  - .build
  - DerivedData
  - "**/*.generated.swift"
  - build

disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - modifier_order
  - overridden_super_call
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_imports
  - unneeded_parentheses_in_closure_argument
  - vertical_whitespace_closing_braces

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 60
  error: 100

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 800

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y

force_cast: warning
force_unwrapping: warning
force_try: warning

reporter: "xcode"
