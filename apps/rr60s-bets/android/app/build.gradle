plugins { id 'com.android.application' }
android {
    namespace 'com.wise2.rr60sbets'
    compileSdk 34
    defaultConfig {
        applicationId 'com.wise2.rr60sbets'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    signingConfigs {
        if (System.getenv('RR60S_KEYSTORE_PATH')) {
            create('release') {
                storeFile file(System.getenv('RR60S_KEYSTORE_PATH'))
                storePassword System.getenv('RR60S_STORE_PASSWORD')
                keyAlias System.getenv('RR60S_KEY_ALIAS')
                keyPassword System.getenv('RR60S_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingConfigs.findByName('release') != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
