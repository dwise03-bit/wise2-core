version: '3.8'

services:
  petals-potions-web:
    build:
      context: ../../
      dockerfile: apps/petals-potions/Dockerfile.prod
    container_name: petals-potions-web
    restart: always
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://petals-potions.wise2.io/api
      NEXT_PUBLIC_STRIPE_KEY: ${STRIPE_PUBLIC_KEY}
      PORT: 3003
    networks:
      - wise2-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.petals-potions.description=Petals & Potions Customer Frontend"
      - "com.petals-potions.port=3003"

networks:
  wise2-network:
    driver: bridge
