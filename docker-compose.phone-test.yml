version: '3.8'

services:
  phone-gateway:
    image: node:18-alpine
    container_name: wise2-phone-gateway
    working_dir: /app
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      API_BASE_URL: http://localhost:3000
      TENANT_ID: default-workspace
      LOG_LEVEL: info
    volumes:
      - ./apps/phone-gateway:/app
    command: sh -c "npm install && npm start"
    networks:
      - wise2

networks:
  wise2:
    driver: bridge
