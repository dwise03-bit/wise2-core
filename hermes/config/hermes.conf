# WISE² Hermes client config (NON-SECRET). Safe to commit.
# DISABLED until the real private endpoint AND a device credential exist.
# See DEVICE-CREDENTIAL.md and HERMES-PRODUCTION-CONNECTION-PENDING.md.

HERMES_ENABLED=false

# Private (Tailscale) base URL of the Hermes front (NO trailing slash).
# e.g. http://<vps-tailnet-ip>   — left blank intentionally until confirmed.
HERMES_BASE_URL=

# nginx same-origin proxy prefix in front of the brain API.
HERMES_BRAIN_PREFIX=/brain-api

# Endpoints (relative to BASE_URL + BRAIN_PREFIX), from read-only repo inspection:
HERMES_HEALTH_PATH=/api/health                               # unauthenticated
HERMES_AUTH_CHECK_PATH=/api/v1/brain-auth/status             # authenticated
HERMES_MEMORY_PATH=/api/v1/brain-auth/knowledge/graph/stats  # authenticated

# This device's identity (non-secret).
HERMES_DEVICE_ID=wise2-surface

# Path to the per-device credential (SECRET; chmod 600; git-ignored).
# NOT created yet — no production credential has been minted/installed.
HERMES_CREDENTIAL_FILE=/opt/wise2/hermes/credentials/device-token

# Network timeout (seconds) for probes.
HERMES_TIMEOUT=4
