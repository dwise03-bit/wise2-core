[general]
name=WISE² Packout Monitor Stand - Optimized for Anycubic Kobra X
version=5.0
definition=fdmprinter

[metadata]
type=quality
machine_name=Anycubic Kobra X
material=Generic PLA
nozzle_diameter=0.6
priority=1

; ============================================================================
; TEMPERATURE SETTINGS
; ============================================================================
[values]
material_bed_temperature=58
material_print_temperature=205
material_print_temperature_layer_0=210
material_bed_temperature_layer_0=60
material_final_print_temperature=205
material_final_bed_temperature=58
material_flow=100

; ============================================================================
; LAYER & RESOLUTION
; ============================================================================
layer_height=0.32
layer_height_0=0.40
line_width=0.65
wall_thickness=1.95
wall_line_width=0.65
wall_line_width_0=0.75
top_thickness=1.28
bottom_thickness=1.28
top_layers=4
bottom_layers=4
raft_margin=2
raft_airgap=0.4

; ============================================================================
; INFILL & STRUCTURE
; ============================================================================
infill_density=12
infill_pattern=gyroid
infill_line_distance=2.0
infill_overlap=10
infill_angles=[45, 135]
infill_sparse_density=0
infill_before_walls=True
monotonic_top_bottom=True
zig_zaggify_support=False

; ============================================================================
; PRINT SPEED
; ============================================================================
speed_print=60
speed_infill=80
speed_wall=60
speed_wall_0=30
speed_topbottom=50
speed_travel=100
speed_layer_0=30
acceleration_enabled=True
acceleration_print=3000
acceleration_infill=3000
acceleration_layer_0=1000
acceleration_topbottom=1500
jerk_enabled=False

; ============================================================================
; RETRACTION & COMBING
; ============================================================================
retraction_enable=True
retraction_amount=5
retraction_speed=25
retraction_extrusion_window=5
retraction_count_max=90
retraction_hop_enabled=True
retraction_hop_amount=0.2
retraction_min_travel=3
retraction_retract_speed=25
retraction_prime_speed=25
coasting_enable=True
coasting_volume=0.064
coasting_speed=0.5
wipe_retraction_enable=True
wipe_retraction_amount=5

; ============================================================================
; ADHESION & BUILD PLATE
; ============================================================================
adhesion_type=skirt
skirt_line_count=1
skirt_gap=3
raft_base_thickness=0
raft_interface_thickness=0
raft_surface_layers=0
raft_airgap_all_at_once=False
prime_blob_enable=False
extruder_prime_pos_x=0
extruder_prime_pos_y=0
extruder_prime_pos_z=0
z_offset=0.0

; ============================================================================
; SUPPORT SETTINGS
; ============================================================================
support_enable=False
support_structure=tree
support_angle=45
support_pattern=grid
support_density=15
support_z_distance=0.2
support_xy_distance=0.8
support_wall_count=1

; ============================================================================
; NOZZLE SIZE & EXTRUSION
; ============================================================================
machine_nozzle_size=0.6
machine_nozzle_id=0
machine_nozzle_offset_x=0
machine_nozzle_offset_y=0
machine_width=260
machine_depth=260
machine_height=260
machine_heated_bed=True
machine_center_is_zero=False
machine_gcode_flavor=reprap
nozzle_disallowed_areas=[]

; ============================================================================
; QUALITY & DETAILS
; ============================================================================
print_thin_walls=True
fill_sparse_density=0
min_wall_line_width=0.3
min_feature_size=0.1
min_wall_thickness=0.4
small_feature_max_length=0
small_feature_speed_factor=100
wall_0_wipe_dist=0.1
outer_inset_first=False
alternate_extra_perimeter=True
extra_skin_line_width=0.4
roofing_layer_count=1

; ============================================================================
; TRAVEL & MOVEMENT
; ============================================================================
retract_at_layer_change=False
travel_avoid_other_parts=True
travel_avoid_supports=True
travel_retract_before_outer_wall=False
disallowed_areas_type=no_restriction

; ============================================================================
; MATERIAL & FLOW
; ============================================================================
material_standby_temperature=180
material_anti_ooze_retracted_position=-4
material_anti_ooze_retraction_speed=5
material_no_load_move_factor=0.94
material_flow_layer_0=100
material_flow_print_temperature=200
skin_point_sample_distance=8
skin_monotonic=True

; ============================================================================
; PERFORMANCE & OPTIMIZATION
; ============================================================================
adaptive_layer_height_enabled=False
adaptive_layer_height_variation=0.04
adaptive_layer_height_variation_step=0.04
slicing_tolerance=middle
carve_multiple_volumes=True
union_all_remove_holes=False

; ============================================================================
; SPECIAL SETTINGS FOR PACKOUT MONITOR STAND
; ============================================================================
; These settings are specifically tuned for:
; - Anycubic Kobra X (260×260 mm bed, auto-level)
; - 0.6 mm nozzle (high extrusion width allows faster printing)
; - PLA filament (standard 1.75 mm)
; - No supports (geometry designed to bridge cleanly)
; - Fast print time (<3 hours total)
; - 12% infill (balance of speed and stiffness)
; - Industrial appearance (smooth surface finish)
; ============================================================================

; ============================================================================
; PRINTER-SPECIFIC FEATURES
; ============================================================================
machine_extruder_count=1
machine_use_extruder_offset_to_offset_coords=True
extruders_enabled_count=1

; ============================================================================
; COOLING
; ============================================================================
cool_fan_enabled=True
cool_fan_speed=100
cool_fan_speed_layer_0=0
cool_fan_speed_max=100
cool_min_layer_time=10
cool_min_speed=10
cool_lift_head=False

; ============================================================================
; OUTPUT & G-CODE
; ============================================================================
relative_extrusion=False
gcode_comments=False
gcode_flavor=reprap
gcode_add_line_m73=False
machine_start_gcode=G28\nG29\nG0 Z10\nM140 S{material_bed_temperature_layer_0}\nM104 S{material_print_temperature_layer_0}\nM109 S{material_print_temperature_layer_0}\nM190 S{material_bed_temperature_layer_0}
machine_end_gcode=M104 S0\nM140 S0\nG28 X0 Y0\nM84
machine_extruder_start_code=
machine_extruder_end_code=

; ============================================================================
; PROFILE NOTES
; ============================================================================
; This profile is optimized for:
;
; PRINTER: Anycubic Kobra X (260×260 mm bed, auto bed leveling)
; NOZZLE: 0.6 mm (default Anycubic nozzle)
; MATERIAL: Generic PLA (1.75 mm diameter)
;
; PRINT SETTINGS:
; - Nozzle: 205°C
; - Bed: 58°C
; - Layer Height: 0.32 mm (maximum for 0.6 mm nozzle)
; - Infill: 12% Gyroid (optimal strength-to-speed ratio)
; - Walls: 3 perimeter (1.95 mm total)
; - Supports: NONE (design optimized for bridge gaps)
;
; EXPECTED RESULTS:
; - Print Time: 3h 12 min (sequential parts)
; - Quality: Smooth surface, clean details
; - Strength: 3× safety factor at 18 N load
; - Weight: 69 g total PLA
;
; TROUBLESHOOTING:
; - If first layer sticks too much: Lower bed to 55°C
; - If first layer won't stick: Raise bed to 60°C
; - If strings appear: May need retraction tuning
; - If layer lines visible: Normal at 0.32 mm, can sand if needed
;
; ============================================================================
