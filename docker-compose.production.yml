# WISE² Platform Production Compose (AUTHORITATIVE for platform API architecture)
version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: wise2-postgres-prod
    environment: { POSTGRES_USER: "${POSTGRES_ADMIN_USER:-postgres}", POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:-secure_postgres_admin_2026}", POSTGRES_DB: postgres, POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:-wise2_prod_secure_2026}", PGDATA: /var/lib/postgresql/data/pgdata }
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro", "postgres_data:/var/lib/postgresql/data", "postgres_wal:/var/lib/postgresql/wal"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -h localhost -p 5432"], interval: 10s, timeout: 5s, retries: 5, start_period: 15s }
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: wise2-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
  mongodb:
    image: mongo:7
    container_name: wise2-mongodb
    environment: { MONGO_INITDB_ROOT_USERNAME: admin, MONGO_INITDB_ROOT_PASSWORD: "${MONGODB_PASSWORD:-secure_password_2026}" }
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongodb_data:/data/db"]
    restart: unless-stopped
  api:
    build: { context: ., dockerfile: packages/api/Dockerfile }
    container_name: wise2-api-prod
    environment: { NODE_ENV: production, PORT: 3001, API_PORT: 3001, DATABASE_URL: "postgresql://wise2_prod_user:${POSTGRES_APP_PASSWORD:-wise2_prod_secure_2026}@postgres:5432/wise2_core_prod", REDIS_URL: "redis://redis:6379", REDIS_PASSWORD: "${REDIS_PASSWORD:-password}", JWT_SECRET: "${JWT_SECRET}" }
    ports: ["127.0.0.1:3010:3001"]
    depends_on: [postgres, redis]
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    container_name: wise2-ollama-prod
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
    restart: unless-stopped
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.10.2
    container_name: wise2-open-webui-prod
    environment: { OLLAMA_BASE_URL: "http://ollama:11434", WEBUI_SECRET_KEY: "${OPEN_WEBUI_SECRET_KEY}" }
    ports: ["127.0.0.1:3020:8080"]
    volumes: ["open_webui_data:/app/backend/data"]
    restart: unless-stopped
  website:
    build: { context: ., dockerfile: apps/website/Dockerfile }
    container_name: wise2-website-prod
    environment: { NODE_ENV: production, NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://api.wise2.net}" }
    ports: ["127.0.0.1:3011:3000"]
    restart: unless-stopped
  dashboard:
    build: { context: ., dockerfile: apps/dashboard/Dockerfile }
    container_name: wise2-dashboard-prod
    environment: { NODE_ENV: production, NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://api.wise2.net}" }
    ports: ["127.0.0.1:3002:3000"]
    restart: unless-stopped
  admin:
    build: { context: ., dockerfile: apps/admin/Dockerfile }
    container_name: wise2-admin-prod
    environment: { NODE_ENV: production, NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://api.wise2.net}" }
    ports: ["127.0.0.1:3003:3000"]
    restart: unless-stopped
  studio:
    build: { context: ., dockerfile: apps/studio/Dockerfile }
    container_name: wise2-studio-prod
    environment: { NODE_ENV: production, NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-https://api.wise2.net}" }
    ports: ["127.0.0.1:3005:3003"]
    restart: unless-stopped
  command-center:
    build: { context: ., dockerfile: apps/command-center/Dockerfile }
    container_name: wise2-command-center-prod
    environment: { NODE_ENV: production, PORT: 3000, HOSTNAME: 0.0.0.0 }
    ports: ["127.0.0.1:3004:3000"]
    restart: unless-stopped
  worker:
    build: { context: ., dockerfile: services/worker/Dockerfile }
    container_name: wise2-worker-content-prod
    environment: { NODE_ENV: production, REDIS_URL: "redis://:${REDIS_PASSWORD:-password}@redis:6379", DATABASE_URL: "postgresql://wise2_prod_user:${POSTGRES_APP_PASSWORD:-wise2_prod_secure_2026}@postgres:5432/wise2_core_prod" }
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    container_name: wise2-prometheus-prod
    volumes: ["./infrastructure/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "prometheus_data:/prometheus"]
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    container_name: wise2-grafana-prod
    environment: { GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}", GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-}" }
    volumes: ["grafana_data:/var/lib/grafana"]
    ports: ["127.0.0.1:3100:3000"]
    restart: unless-stopped
  control-bridge:
    build: { context: ., dockerfile: services/control-bridge/Dockerfile }
    container_name: wise2-control-bridge
    environment:
      NODE_ENV: production
      CONTROL_AUTH_TOKEN: "${CONTROL_AUTH_TOKEN:?CONTROL_AUTH_TOKEN is required}"
      CONTROL_PORT: 8787
      CONTROL_REPO_PATH: /workspace
      CONTROL_COMPOSE_FILE: /workspace/docker-compose.production.yml
      CONTROL_AUDIT_FILE: /data/audit.jsonl
      CONTROL_OLLAMA_URL: http://ollama:11434/api/tags
      CONTROL_HERMES_URL: "${CONTROL_HERMES_URL:-http://host.docker.internal:8642/health}"
      CONTROL_WISE2_URL: https://wise2.net
      CONTROL_WRITE_ENABLED: "${CONTROL_WRITE_ENABLED:-false}"
      CONTROL_ALLOWED_SERVICES: "${CONTROL_ALLOWED_SERVICES:-api,website,dashboard,admin,studio,command-center,worker,ollama,open-webui}"
    ports: ["127.0.0.1:8787:8787"]
    volumes: [".:/workspace:ro", "/var/run/docker.sock:/var/run/docker.sock", "control_bridge_data:/data"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
volumes:
  postgres_data: {}
  postgres_wal: {}
  redis_data: {}
  mongodb_data: {}
  prometheus_data: {}
  grafana_data: {}
  ollama_data: {}
  open_webui_data: {}
  control_bridge_data: {}
networks:
  default: { name: wise2-prod-network, driver: bridge }
