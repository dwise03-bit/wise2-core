<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WISE² · Primary Command Center</title>
<style>
:root{color-scheme:dark;--bg:#04070d;--panel:#0b1423;--line:#233148;--text:#e8edf3;--muted:#a2b1c3;--green:#30f591;--amber:#f4c661;--red:#ff7888}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#12223b,transparent 60%),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}header{display:flex;align-items:center;gap:24px;padding:18px 24px;border-bottom:1px solid var(--line);background:#070d17;flex-wrap:wrap}.logo{font-size:29px;font-weight:850;letter-spacing:.12em;background:linear-gradient(#fff,#aebbc9 45%,#fff 50%,#697787);color:transparent;background-clip:text}.logo sup{color:var(--green);font-size:19px}.tag{font-size:11px;letter-spacing:.13em;color:var(--muted)}#connection{margin-left:auto;font-size:12px;color:var(--amber)}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 102px)}nav{padding:22px 12px;border-right:1px solid var(--line)}nav a{display:flex;align-items:center;min-height:46px;padding:10px 14px;color:var(--muted);text-decoration:none;border-radius:6px;font-size:12px;letter-spacing:.12em;margin-bottom:4px}nav a:hover,nav a:focus-visible{background:#18263c;color:white}nav a[aria-current=page]{background:#102c26;color:var(--green);border-left:3px solid var(--green)}main{padding:28px;max-width:1600px;width:100%}.eyebrow{color:var(--green);font-size:11px;letter-spacing:.15em}h1{margin:8px 0 4px;font-size:27px;font-weight:650}#subtitle{color:var(--muted);margin:0 0 24px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}.card{border:1px solid var(--line);border-radius:12px;padding:20px;background:linear-gradient(140deg,#111d2f,var(--panel));min-width:0}.card h2{margin:0 0 16px;font-size:11px;letter-spacing:.13em;color:var(--muted);text-transform:uppercase}.row{display:flex;justify-content:space-between;gap:18px;padding:8px 0;border-bottom:1px solid #1b293d;font-size:13px}.row:last-child{border:0}.key{color:var(--muted)}.value{text-align:right;overflow-wrap:anywhere;max-width:70%}.good{color:var(--green)}.warning{color:var(--amber)}.bad{color:var(--red)}.note{color:var(--muted);font-size:13px;overflow-wrap:anywhere}.metric{font-size:34px;letter-spacing:-.04em;font-weight:650}.bar{height:7px;background:#1f2c40;border-radius:5px;overflow:hidden;margin-top:16px}.bar i{display:block;height:100%;background:var(--green)}footer{border-top:1px solid var(--line);padding:12px 24px;font-size:11px;color:var(--muted)}a:focus-visible{outline:2px solid var(--green);outline-offset:2px}@media(max-width:800px){.layout{grid-template-columns:1fr}nav{display:flex;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line);border-right:0;gap:4px}nav a{margin:0;flex:1 0 auto;justify-content:center}main{padding:20px}header{gap:12px;padding:16px}#connection{width:100%;margin:0}.tag{font-size:10px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<script src="/app.js" defer></script>
</head>
<body>
<header><div class="logo">WISE<sup>²</sup></div><div><div>LINUX COMMAND CENTER</div><div class="tag">PRIMARY NODE · SURFACE LAPTOP 4</div></div><div id="connection" role="status" aria-live="polite">Collecting observations…</div></header>
<div class="layout"><nav aria-label="Modules" id="navigation"></nav><main><div class="eyebrow">WORKSTATION CONTROL PLANE</div><h1 id="title">System</h1><p id="subtitle">Live observations and clearly marked integration status.</p><div id="grid" class="grid"></div></main></div>
<footer>Localhost · Read-only dashboard · Security operations require Daniel’s authorization · <span id="observed">No observation yet</span></footer>
</body></html>
