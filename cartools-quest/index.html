<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WISE² CarTools — Quest City</title><style>body{margin:0;background:#080e1a;color:white;font-family:system-ui}#hud{position:fixed;top:12px;left:12px;z-index:5;background:#081425cc;padding:12px;border:1px solid #36b9ff;border-radius:12px}button{padding:9px;background:#0879bc;color:white;border:0;border-radius:6px}small{display:block;margin-top:8px}</style><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script></head><body><div id="hud"><b>WISE² CAR TOOLS / QUEST CITY</b><small>WASD / arrows drive · Quest: left stick move, right stick turn</small><button onclick="document.querySelector('a-scene').enterVR()">ENTER VR</button><p id="speed">Speed: 0</p></div><a-scene background="color:#7cb7df" fog="type:linear;color:#7cb7df;near:100;far:270"><a-assets></a-assets><a-light type="ambient" intensity=".7"></a-light><a-light type="directional" position="-20 35 10" intensity=".8"></a-light><a-plane rotation="-90 0 0" width="500" height="500" color="#358567"></a-plane><a-entity id="city"></a-entity><a-entity id="car" position="0 0.65 0"><a-box width="1.9" height=".65" depth="3.8" color="#086dff"></a-box><a-box position="0 .55 -.2" width="1.65" height=".7" depth="1.9" color="#16334e"></a-box><a-box position="0 .15 -1.95" width="1.4" height=".2" depth=".15" color="#f5f5cc"></a-box><a-entity id="rig" position="0 2.4 6.8"><a-camera wasd-controls-enabled="false" look-controls="pointerLockEnabled:false"></a-camera></a-entity></a-entity><a-entity laser-controls="hand:left"></a-entity><a-entity laser-controls="hand:right"></a-entity></a-scene><script>
const city=document.getElementById('city'),car=document.getElementById('car');const el=(tag,attrs,parent=city)=>{let e=document.createElement(tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e};for(let i=-5;i<=5;i++){el('a-box',{position:`${i*28} .02 0`,width:10,height:.05,depth:330,color:'#303943'});el('a-box',{position:`0 .02 ${i*28}`,width:330,height:.05,depth:10,color:'#303943'});}for(let x=-5;x<=5;x++)for(let z=-5;z<=5;z++){if(Math.abs(x)<1&&Math.abs(z)<1)continue;let h=7+((x*x*13+z*z*17+Math.abs(x*z)*3)%35);el('a-box',{position:`${x*28+13} ${h/2} ${z*28+13}`,width:14,height:h,depth:14,color:['#dcae9a','#8bacc0','#c7b8a2','#d6c8b8'][Math.abs(x+z*3)%4]});}
const keys=new Set();addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));let speed=0,angle=0,prev=performance.now();function frame(t){let dt=Math.min((t-prev)/1000,.05);prev=t;let pads=navigator.getGamepads?navigator.getGamepads():[];let pad=Array.from(pads).find(p=>p&&p.axes.length>1);let throttle=(keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0)-(pad?pad.axes[1]:0);let steer=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0)+(pad?(pad.axes[2]||pad.axes[0]||0):0);speed+=throttle*14*dt;speed*=Math.pow(.965,dt*60);speed=Math.max(-12,Math.min(26,speed));angle+=steer*dt*speed*.025;let p=car.object3D.position;p.x-=Math.sin(angle)*speed*dt;p.z-=Math.cos(angle)*speed*dt;car.object3D.rotation.y=angle;document.getElementById('speed').textContent='Speed: '+Math.abs(speed*2.237).toFixed(0)+' mph';requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
