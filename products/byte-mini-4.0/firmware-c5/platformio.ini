[env:byte_mini_esp32c5]
platform = espressif32@7.0.1
board = seeed_xiao_esp32c5
framework = espidf
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -O2
    -ffunction-sections
    -fdata-sections

; Override toolchain via build environment
platform_packages =
    toolchain-riscv32-esp

lib_deps =

upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    colorize

debug_tool = esp-prog
debug_speed = 20000

[env:dev]
extends = env:byte_mini_esp32c5
build_flags = ${env:byte_mini_esp32c5.build_flags}
    -DDEBUG=1
    -DDEBUG_SERIAL=1
    -DLV_LOG_LEVEL=LV_LOG_LEVEL_TRACE

[env:release]
extends = env:byte_mini_esp32c5
build_flags = ${env:byte_mini_esp32c5.build_flags}
    -DRELEASE=1
    -O3
    -flto
