# WISE² control-bridge client config (NON-SECRET). Safe to commit.
# DISABLED until the private tailnet endpoint AND a device Bearer token exist.
# See CONTROL-BRIDGE-CONNECTION-PENDING.md and DEVICE-CREDENTIAL.md.

BRIDGE_ENABLED=false

# Private (Tailscale) base URL in front of the control-bridge (NO trailing slash).
# e.g. http://<vps-tailnet-ip>  — left blank intentionally until confirmed.
BRIDGE_BASE_URL=

# Path prefix. The control-bridge serves at /v1/control/* directly; if an nginx
# reverse-proxy puts it behind a different prefix on the tailnet, change here.
BRIDGE_PATH_PREFIX=/v1/control

# Endpoints (relative to BASE_URL + PATH_PREFIX), from read-only repo inspection:
BRIDGE_HEALTH_PATH=/health                 # unauthenticated
BRIDGE_STATUS_PATH=/status                 # authenticated (aggregate)
BRIDGE_SERVICES_PATH=/docker/services      # authenticated (read-only)

# This device's identity (non-secret).
BRIDGE_DEVICE_ID=wise2-surface

# Paths to credentials (SECRET; chmod 600; git-ignored). Not created yet.
BRIDGE_TOKEN_FILE=/opt/wise2/bridge/credentials/control-token
BRIDGE_SIGNING_KEY_FILE=/opt/wise2/bridge/credentials/signing-key

# Surface starts READ-ONLY. Writes stay off until Daniel explicitly enables them.
BRIDGE_ALLOW_WRITES=false

# Network timeout (seconds) for probes.
BRIDGE_TIMEOUT=4
