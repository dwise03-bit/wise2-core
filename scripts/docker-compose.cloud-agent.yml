services:
  postgres:
    image: postgres:15-alpine
    container_name: wise2-postgres-cloud
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wise2_core
    ports:
      - "5432:5432"
    volumes:
      - postgres_cloud_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wise2-redis-cloud
    command: redis-server --requirepass password
    ports:
      - "6379:6379"
    volumes:
      - redis_cloud_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_cloud_data:
  redis_cloud_data:
