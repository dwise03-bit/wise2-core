# BLAKKHAIL PORT MANAGEMENT SYSTEM
# Production: 173.208.147.165
# Updated: 2026-10-08

## CRITICAL PORTS
22   = SSH (Remote Access)
80   = HTTP (Blakkhail Storefront)
443  = HTTPS (KERNEL ISSUE - USE 8443)
8443 = HTTPS Alternative (iptables→443)

## BLAKKHAIL SERVICES  
3001 = Next.js Backend (docker-proxy)
80   = Nginx Reverse Proxy

## WEB SERVICES
8888 = Node.js Application
3016 = Python Backend

## DATABASES (INTERNAL)
27017 = MongoDB
6379  = Redis

## SPECIALIZED (LOCALHOST)
1883  = MQTT Broker
4000  = NexusDB
5038  = Asterisk SIP
8088  = Asterisk AMI
11434-11436 = Ollama (LLM)

## EMAIL (RESTRICTED)
25   = SMTP (Docker networks)
143  = IMAP (Localhost only)
587  = SMTPS (Docker networks)
993  = IMAPS (Localhost only)

## SYSTEM (DO NOT USE)
111, 139, 445, 2049, 631, 3389, 5060-5061

## PORT ALLOCATION STRATEGY
- 80-89: Web Services
- 3000-3100: App Backends
- 4000-4999: Specialized
- 5000-5999: Databases
- 8000-8999: Web Services (high)
- 9000-9999: Management
- 11000-11999: ML/AI

## FIREWALL RULES
✅ SSH (22): Allow worldwide
✅ HTTP (80): Allow worldwide  
✅ SMTP (25): Allow Docker networks only
❌ HTTPS (443): BLOCKED (kernel issue)
✅ IMAP (143): Localhost only
✅ RDP (3389): Localhost only
✅ Blakkhail (3001): Allow worldwide via port 80

## KNOWN ISSUES
1. Port 443 cannot bind (kernel socket state issue)
   - Workaround: Use 8443 + iptables redirect
   - Impact: HTTPS inaccessible
   - Status: Requires server rebuild or kernel patch

2. Multiple Tailscale connections on 443
   - May interfere with port 443 binding
   - Status: Investigate if issues persist

## MONITORING COMMANDS
netstat -tlnp | grep LISTEN  # All listening ports
lsof -i :PORT                # Check specific port
ufw status numbered           # Firewall rules
