# WISE² HVAC Field Tech — hvac.wise2.net
# Proxies via Tailscale to the WISE² Mac running wise-hvac-demo on port 3024.
# Port 3024 is not exposed publicly; only the VPS nginx edge is public.

upstream hvac_fieldtech_backend {
    server 100.64.72.14:3024;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hvac.wise2.net;

    ssl_certificate /etc/letsencrypt/live/hvac.wise2.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hvac.wise2.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Clean public path -> Next.js redirect handles /field-tech on the app
    location / {
        proxy_pass http://hvac_fieldtech_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name hvac.wise2.net;
    return 301 https://$host$request_uri;
}
