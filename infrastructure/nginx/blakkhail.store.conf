# BLACKHAIL.STORE Production Nginx Configuration
# Unified SenCere Creative Ecosystem - BLACKHAIL Brand Portal
# Handles routing for blackhail.store domain

# Upstream backends
upstream blakkhail_website {
    server 127.0.0.1:3000;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name blackhail.store www.blackhail.store;
    return 301 https://$server_name$request_uri;
}

# Root domain - Unified SenCere Creative Website (BLAKKHAIL Portal)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blackhail.store www.blackhail.store 173.208.147.165;

    # SSL Certificates (temporary self-signed, will upgrade to Let's Encrypt)
    ssl_certificate /etc/nginx/ssl/blakkhail.crt;
    ssl_certificate_key /etc/nginx/ssl/blakkhail.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;
    gzip_min_length 1000;

    # Main proxy to unified SenCere Creative website
    location / {
        proxy_pass http://blakkhail_website;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://blakkhail_website;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for dynamic content
    location ~* \.(html|json)$ {
        proxy_pass http://blakkhail_website;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
}
