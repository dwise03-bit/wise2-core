# Team app packages — wise2.net location block
# Files live on the VPS at /var/www/html/downloads/apps/
# Publish with: ./scripts/ios/publish-team-ipa.sh <app>
# Then: rsync -avz apps/website/public/downloads/apps/*.ipa dwise@host:/var/www/html/downloads/apps/

    location ^~ /downloads/apps/ {
        alias /var/www/html/downloads/apps/;
        types {
            application/octet-stream ipa;
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=300";
        sendfile on;
        tcp_nopush on;
    }
