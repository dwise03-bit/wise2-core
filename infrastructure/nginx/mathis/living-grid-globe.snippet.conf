# Mathis Electric Living Grid – God's Eye View same-origin proxy
# Place inside the mathis.wise2.net (or relevant) server block.
# Requires isolated GEV service listening on 127.0.0.1:4173 (or adjusted upstream).
# GEV must be started with GEV_EMBED_FRAME_ANCESTORS=https://mathis.wise2.net
# and preferably vite base='/living-grid/globe/' or equivalent prefix handling.

location /living-grid/globe/ {
    # Strip prefix if GEV is served at root; adjust if GEV uses matching base.
    proxy_pass http://127.0.0.1:4173/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Production-safe framing: only allow mathis.wise2.net (GEV also enforces via env)
    add_header Content-Security-Policy "frame-ancestors 'self' https://mathis.wise2.net" always;
    # Do not set X-Frame-Options DENY here; let GEV embed mode + CSP control it.

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
