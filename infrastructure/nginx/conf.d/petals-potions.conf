# Petals & Potions - Customer Frontend
# Port: 3003 (dedicated, no conflicts with main app ports 3000/3001)
# Domain: petals-potions.wise2.net

upstream petals_potions_backend {
    server localhost:3003;
    keepalive 32;
}

server {
    listen 80;
    server_name petals-potions.wise2.net petals-potions.local;

    # Redirect HTTP to HTTPS (production only)
    # Uncomment in production with valid SSL cert
    # return 301 https://$server_name$request_uri;

    # Logging
    access_log /var/log/nginx/petals-potions-access.log combined;
    error_log /var/log/nginx/petals-potions-error.log warn;

    # Max upload size for orders/assets
    client_max_body_size 50M;

    # Root proxy configuration
    location / {
        proxy_pass http://petals_potions_backend;
        proxy_http_version 1.1;

        # Connection headers
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Static assets caching (Next.js)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://petals_potions_backend;
        proxy_cache_valid 200 30d;
        proxy_cache_bypass $http_pragma $http_authorization;
        add_header Cache-Control "public, max-age=2592000";
        expires 30d;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://petals_potions_backend;
        access_log off;
    }

    # API routes (if separate)
    location /api/ {
        proxy_pass http://petals_potions_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

