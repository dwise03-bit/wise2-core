# Paste inside the wise2.net / www.wise2.net server {} block, BEFORE `location /`.
# Routes legacy website paths to the Command Center app on command.wise2.net.

location = /sound-lab {
    return 302 https://command.wise2.net/sound-lab;
}

location ^~ /sound-lab/ {
    return 302 https://command.wise2.net$request_uri;
}

location = /sound-labs {
    return 302 https://command.wise2.net/sound-lab/projects;
}

location ~ ^/sound-labs/(?<project>.*)$ {
    return 302 https://command.wise2.net/sound-lab/projects/$project;
}

location = /studio {
    return 302 https://command.wise2.net/sound-lab;
}

location ^~ /studio/ {
    return 302 https://command.wise2.net/sound-lab;
}

location = /command-center {
    return 302 https://command.wise2.net;
}

location ^~ /command-center/ {
    return 302 https://command.wise2.net$request_uri;
}

location = /dashboard {
    return 302 https://command.wise2.net/dashboard;
}
