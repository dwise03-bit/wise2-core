# WISE² HVAC Field Tech — hvac.wise2.net (HTTP bootstrap for certbot)
# After DNS A record -> 173.208.147.165 and certbot, enable hvac.wise2.net.conf

upstream hvac_fieldtech_backend {
    server 100.64.72.14:3024;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name hvac.wise2.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://hvac_fieldtech_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }
}
