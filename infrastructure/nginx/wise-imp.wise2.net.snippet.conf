# WISE Imp — wise2.net location block
# Add inside the wise2.net server {} block on the VPS, before the catch-all location /.

    # WISE Imp Desktop — hosted companion service
    location = /imp {
        return 301 /imp/;
    }

    location ^~ /imp/ {
        alias /var/www/html/wise-imp/;
        index index.html;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
    }
