<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WISE² | Living Hive</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 30%,#102d47,#030711 70%);color:#eaf7ff;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;padding:24px 5vw;border-bottom:1px solid #23516a}h1{font-size:clamp(2rem,5vw,4rem);letter-spacing:.12em;margin:0}small,.muted{color:#8baabc}main{max-width:1450px;margin:auto;padding:5vh 5vw}.orb{height:210px;width:210px;margin:30px auto;border:1px solid #37caff;border-radius:50%;box-shadow:0 0 30px #009dff55,inset 0 0 65px #009dff22;display:grid;place-items:center;position:relative}.orb:before,.orb:after{content:"";position:absolute;border:1px solid #28a8e777;border-radius:50%;inset:20px}.orb:after{inset:45px}.orb strong{font-size:2.4rem;z-index:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.tile{background:#091a2bcc;border:1px solid #1c5572;border-radius:16px;padding:22px;min-height:130px}.tile h2{font-size:1rem;color:#7fdcff;margin:0 0 15px}.status{font-size:1.3rem;font-weight:700}.unknown{color:#ffce74}.ok{color:#68f6bd}.bad{color:#ff7b88}a{color:#b4eaff}footer{padding:30px 5vw;text-align:center;color:#7894a8}button{background:#113d57;color:white;border:1px solid #42baf4;padding:10px 16px;border-radius:9px;cursor:pointer}@media(max-width:500px){header{padding:16px}h1{font-size:1.6rem}.orb{width:160px;height:160px}}
</style></head><body><header><div><small>WISE² // UNIFIED OPERATIONS</small><h1>LIVING HIVE</h1></div><button id="refresh">Refresh health</button></header>
<main><div class="orb"><strong>WISE²</strong></div><p class="muted" style="text-align:center">Pocket Node • Ubuntu Server • Hermes • Commander</p><section class="grid" id="grid" aria-live="polite"></section></main><footer>Read-only status dashboard. Unknown is not online. No remote commands execute from this page.</footer>
<script>
const services=[['Pocket Node','/woji/api/health/pocket'],['Ubuntu Server','/woji/api/health/server'],['Hermes AI','/woji/api/health/hermes'],['WISE² Commander','/woji/api/health/commander'],['Trading','/woji/api/health/trading'],['Storage','/woji/api/health/storage']];
const grid=document.querySelector('#grid');
async function update(){grid.replaceChildren();await Promise.all(services.map(async ([name,url])=>{const card=document.createElement('article');card.className='tile';const title=document.createElement('h2');title.textContent=name;const state=document.createElement('div');state.className='status unknown';state.textContent='UNVERIFIED';card.append(title,state);grid.append(card);try{const response=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(3500)});if(!response.ok)throw Error('unavailable');const data=await response.json();if(data.status==='ok'&&data.verified===true){state.className='status ok';state.textContent='ONLINE'}else if(data.status==='down'&&data.verified===true){state.className='status bad';state.textContent='DOWN'}}catch{state.textContent='UNVERIFIED'}}))}
document.querySelector('#refresh').addEventListener('click',update);update();
</script></body></html>
