version: '3.9'

# WISE² Docker Compose for Raspberry Pi 3B/4
# Optimized for ARM32v7 architecture with aggressive resource management
#
# This configuration runs the core WISE² platform on Raspberry Pi:
# - API (NestJS backend)
# - Website (Next.js frontend)
# - PostgreSQL database
# - Redis cache
#
# Usage:
#   docker-compose -f docker-compose.pi.yml up -d
#
# Prerequisites:
#   - Raspberry Pi OS Lite 32-bit (recommended for Pi 3B)
#   - Raspberry Pi OS 32/64-bit (for Pi 4)
#   - Docker & Docker Compose installed
#   - 2GB swap configured (Pi 3B) or 1GB swap (Pi 4)
#   - Network connectivity
#
# Resource Expectations:
#   Pi 3B:  1GB RAM + 2GB swap, 4x 1.2GHz ARM cores
#   Pi 4:   2GB/4GB/8GB RAM options, 4x 1.5GHz ARM cores (better)
#
# Performance Notes:
#   - Startup time: 45-90 seconds (includes database migrations)
#   - API response time: 100-500ms (network dependent)
#   - Database operations: 50-200ms
#   - Memory usage at idle: ~600-700MB
#   - Memory under load: ~800-950MB (within limits)
#

services:
  # PostgreSQL 15 - ARM32v7 compatible
  # Primary data store for WISE² platform
  postgres:
    image: postgres:15-alpine
    container_name: wise2-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: wise2_prod
      POSTGRES_USER: wise2
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-wise2secure}
      POSTGRES_INITDB_ARGS: "-c shared_buffers=32MB -c effective_cache_size=64MB"

    ports:
      - "5432:5432"

    volumes:
      # Persistent database data
      - postgres_data:/var/lib/postgresql/data
      # Schema initialization
      - ./packages/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      # WAL archiving for backup (optional, mount external USB)
      # - /mnt/backup/postgres-wal:/var/lib/postgresql/wal

    networks:
      - wise2

    # Resource limits for Raspberry Pi
    # PostgreSQL memory usage depends on shared_buffers (set to 32MB above)
    # Typical usage: 150-250MB depending on dataset size
    deploy:
      resources:
        limits:
          cpus: '1.0'        # Use 1 full core (leave 3 for other services)
          memory: 512M       # Max 512MB (alpine image helps)
        reservations:
          cpus: '0.5'        # Guarantee 0.5 cores
          memory: 256M       # Reserve 256MB

    # Health check - critical for startup dependencies
    # Uses pg_isready which is lightweight and reliable
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wise2 -d wise2_prod"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s    # Give database time to initialize

    logging:
      driver: "json-file"
      options:
        max-size: "50m"    # Prevent log explosion on SD card
        max-file: "3"      # Keep only 3 rotated logs

  # Redis 7-Alpine - ARM32v7 compatible cache/session store
  # Used for session management, caching, and real-time features
  redis:
    image: redis:7-alpine
    container_name: wise2-redis
    restart: unless-stopped

    command:
      - "redis-server"
      - "--maxmemory"
      - "128mb"           # Strict memory limit (Pi memory-constrained)
      - "--maxmemory-policy"
      - "allkeys-lru"     # Evict least-recently-used keys when full
      - "--save"
      - "60 1000"         # Persist: save if 1000 keys changed in 60 seconds
      - "--appendonly"
      - "yes"             # AOF persistence for durability
      - "--appendfsync"
      - "everysec"        # Balance between safety and performance

    ports:
      - "6379:6379"

    volumes:
      # Persistent cache data (append-only file)
      - redis_data:/data

    networks:
      - wise2

    # Resource limits for Raspberry Pi
    # Redis is typically very lightweight (10-50MB depending on data)
    # maxmemory limit above constrains usage
    deploy:
      resources:
        limits:
          cpus: '0.5'        # Use 0.5 core
          memory: 256M       # Max 256MB (enforced by maxmemory too)
        reservations:
          cpus: '0.2'        # Guarantee 0.2 cores
          memory: 64M        # Reserve 64MB

    # Health check - simple PING
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # NestJS API Backend
  # Core business logic, database queries, external integrations
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      args:
        # ARM32v7 target (default Node.js:20 has arm32v7 support)
        NODE_ENV: production

    container_name: wise2-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      # Runtime
      NODE_ENV: production
      PORT: 3000
      NODE_OPTIONS: "--max-old-space-size=256"  # Limit heap to 256MB

      # Database
      DATABASE_URL: postgresql://wise2:${DATABASE_PASSWORD:-wise2secure}@postgres:5432/wise2_prod

      # Redis for sessions/caching
      REDIS_URL: redis://redis:6379/0

      # Stripe payments
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_STARTER_PRICE_ID: ${STRIPE_STARTER_PRICE_ID}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID}

      # SendGrid email
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}

      # URLs for cross-service communication
      APP_URL: ${APP_URL:-http://localhost}
      API_BASE_URL: ${API_BASE_URL:-http://localhost}
      WEBSITE_URL: http://website:3001

      # Logging
      LOG_LEVEL: info

      # Performance tuning for Pi
      # - Reduce connection pool (Pi network/CPU constrained)
      # - Increase timeout (Pi slower)
      # - Reduce query timeout
      DATABASE_POOL_MIN: 2
      DATABASE_POOL_MAX: 5
      REQUEST_TIMEOUT_MS: 30000   # 30 seconds
      DB_QUERY_TIMEOUT_MS: 10000  # 10 seconds

    ports:
      - "3000:3000"

    networks:
      - wise2

    # Resource limits for Raspberry Pi
    # API memory usage: 200-300MB typical
    # Spike usage under load: 350-400MB
    deploy:
      resources:
        limits:
          cpus: '1.5'        # Use up to 1.5 cores
          memory: 512M       # Max 512MB (Node.js heap limit above is 256MB)
        reservations:
          cpus: '0.5'        # Guarantee 0.5 cores
          memory: 256M       # Reserve 256MB

    # Health check - critical for load balancing
    # Endpoint: GET /health
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s    # API startup can take time on Pi

    logging:
      driver: "json-file"
      options:
        max-size: "100m"   # App logs can be verbose
        max-file: "5"

  # Next.js Website Frontend
  # Serves web UI, static assets, server-side rendering
  website:
    build:
      context: .
      dockerfile: Dockerfile.website
      args:
        NODE_ENV: production

    container_name: wise2-website
    restart: unless-stopped

    depends_on:
      api:
        condition: service_healthy

    environment:
      # Runtime
      NODE_ENV: production
      PORT: 3001
      NODE_OPTIONS: "--max-old-space-size=192"  # Limit heap to 192MB

      # API communication (internal Docker network)
      NEXT_PUBLIC_API_URL: ${API_BASE_URL:-http://localhost}
      API_URL: http://api:3000  # Internal service URL

      # Logging
      LOG_LEVEL: info

    ports:
      - "3001:3001"

    networks:
      - wise2

    # Resource limits for Raspberry Pi
    # Next.js SSR memory: 150-250MB typical
    # Build uses more memory (but happens before container start)
    deploy:
      resources:
        limits:
          cpus: '1.0'        # Use up to 1 core
          memory: 384M       # Max 384MB
        reservations:
          cpus: '0.3'        # Guarantee 0.3 cores
          memory: 128M       # Reserve 128MB

    # Health check - simple HTTP
    # Website is lightweight and usually responsive
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

# Persistent volumes for data durability
# Mount on separate USB drive if available (reduces SD card wear)
volumes:
  postgres_data:
    driver: local
    driver_opts:
      # Optional: specify mount point on USB drive
      # device: /mnt/external-usb/postgres
      # type: none
      # o: bind

  redis_data:
    driver: local
    driver_opts:
      # Optional: specify mount point on USB drive
      # device: /mnt/external-usb/redis
      # type: none
      # o: bind

# Internal network for service communication
networks:
  wise2:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500

#
# ============================================================================
# RESOURCE TUNING & MONITORING FOR RASPBERRY PI
# ============================================================================
#
# MEMORY ALLOCATION (Pi 3B: 1GB total):
# ┌─────────────────────────────────────────┐
# │ Total RAM: 1024 MB                      │
# ├─────────────────────────────────────────┤
# │ PostgreSQL:     256-512 MB (shared buf) │
# │ Redis:          64-128 MB               │
# │ API (Node):     256-384 MB              │
# │ Website (Node): 128-192 MB              │
# │ System/Docker:  ~100 MB                 │
# ├─────────────────────────────────────────┤
# │ Total at load:  ~900-1200 MB            │
# │ Swap used:      0-300 MB                │
# └─────────────────────────────────────────┘
#
# OPTIMIZATION STRATEGIES:
#
# 1. SWAP CONFIGURATION (CRITICAL):
#    - Required: 2GB swap on Pi 3B, 1GB on Pi 4
#    - Create: sudo fallocate -l 2G /var/swap.img
#    - Enable: sudo swapon /var/swap.img
#    - Persist: add to /etc/fstab
#    - Monitor: free -h (check swap usage)
#    - Note: Swapping to SD card is slow, but prevents crashes
#
# 2. DISK PERFORMANCE:
#    - Use Class 10+ microSD card (faster than Class 6)
#    - Reduce Docker logging to prevent log explosion
#    - Volumes > 50GB logs should be archived
#    - Command: docker volume ls | xargs -I {} docker volume inspect {} | grep Mountpoint
#
# 3. NETWORK PERFORMANCE:
#    - Ethernet is faster than WiFi (use if available)
#    - WiFi reduces available CPU for I/O
#    - Set static IP to avoid DNS/DHCP overhead
#
# 4. CPU OPTIMIZATION:
#    - Disable unnecessary services (remove from compose)
#    - Use Alpine images when possible (smaller footprint)
#    - Increase health check intervals to reduce CPU polling
#    - Monitor: top -b -n 1 | head -20
#
# 5. DATABASE OPTIMIZATION:
#    - PostgreSQL shared_buffers: 32MB (set above)
#    - Effective cache size: 64MB (set above)
#    - Connection pool: 2-5 connections (set above)
#    - Autovacuum: enabled (default, cleans old data)
#    - Indexes: essential for large tables
#
# 6. REDIS OPTIMIZATION:
#    - maxmemory: 128MB (strict limit, prevents OOM)
#    - maxmemory-policy: allkeys-lru (evicts old data)
#    - Persistence: both RDB + AOF for durability
#    - Monitor: redis-cli INFO memory
#
# MONITORING COMMANDS:
#
# - Overall status: docker-compose ps
# - Service logs: docker-compose logs -f api (or postgres, website, redis)
# - Resource usage: docker stats
# - Memory detail: docker stats --no-stream --format "table {{.Container}}\t{{.MemUsage}}"
# - Disk usage: df -h / && docker volume ls -q | xargs -I {} du -sh /var/lib/docker/volumes/{}_data
# - Pi temperature: vcgencmd measure_temp
# - Network: ip addr show | grep inet
#
# TROUBLESHOOTING:
#
# Problem: OOM (Out of Memory) kills container
# Solution:
#   1. Increase swap size
#   2. Check docker stats for memory spikes
#   3. Reduce connection pool (DATABASE_POOL_MAX)
#   4. Reduce Redis maxmemory
#   5. Enable log rotation (already configured with max-size)
#
# Problem: Slow API responses (>1s)
# Solution:
#   1. Check Pi temperature (should be <70°C)
#   2. Monitor CPU: docker stats
#   3. Check database queries: slow query log in PostgreSQL
#   4. Reduce CONNECTION pool if network is saturated
#   5. Switch to Ethernet if using WiFi
#
# Problem: PostgreSQL won't start
# Solution:
#   1. Check logs: docker-compose logs postgres
#   2. Verify disk space: df -h
#   3. Check data volume: docker volume ls
#   4. If corrupted: delete volume and recreate (loses data!)
#      docker volume rm wise2_postgres_data
#      docker-compose up -d postgres
#
# Problem: High disk I/O (SD card thrashing)
# Solution:
#   1. Move logs to external USB: configure logging driver
#   2. Move volumes to external USB: update driver_opts (uncomment above)
#   3. Reduce log verbosity (LOG_LEVEL: warn instead of info)
#   4. Monitor: iostat -x 1
#
# PRODUCTION CHECKLIST:
#
# Before deploying to production:
# ✓ Configure .env.pi with secure passwords
# ✓ Enable HTTPS (configure nginx or load balancer)
# ✓ Setup backup strategy (automated PostgreSQL dumps)
# ✓ Monitor temperature (setup alerts for >75°C)
# ✓ Configure log rotation (already done, check max-size)
# ✓ Setup network security (firewall, VPN)
# ✓ Test failover (stop container, verify restart)
# ✓ Performance test (load test with expected traffic)
# ✓ Backup configuration (export docker volumes)
#
# EXTERNAL USB SETUP (RECOMMENDED):
#
# Pi SD cards wear out from constant I/O. Use external USB for data:
#
# 1. Plug in USB 3.0 drive (or high-speed USB 2.0)
# 2. Format: lsblk, then mkfs.ext4 /dev/sda1
# 3. Mount: mkdir -p /mnt/external-usb && mount /dev/sda1 /mnt/external-usb
# 4. Persist: add to /etc/fstab: /dev/sda1 /mnt/external-usb ext4 defaults 0 0
# 5. Verify: df -h (should show /mnt/external-usb)
# 6. Uncomment volume driver_opts above to use this mount
# 7. Create data dirs: mkdir -p /mnt/external-usb/{postgres,redis}
# 8. Set permissions: sudo chown 999:999 /mnt/external-usb/postgres
#
# SYSTEMD AUTOSTART (OPTIONAL):
#
# To start containers on Pi boot, create systemd service:
#
# /etc/systemd/system/wise2-docker.service
# ───────────────────────────────────────────
# [Unit]
# Description=WISE² Docker Compose Services
# After=docker.service
# Requires=docker.service
#
# [Service]
# Type=oneshot
# RemainAfterExit=yes
# WorkingDirectory=/home/pi/wise2-core
# ExecStart=/usr/bin/docker-compose -f docker-compose.pi.yml up -d
# ExecStop=/usr/bin/docker-compose -f docker-compose.pi.yml down
# User=pi
#
# [Install]
# WantedBy=multi-user.target
# ───────────────────────────────────────────
#
# Enable: sudo systemctl enable wise2-docker.service
# Start: sudo systemctl start wise2-docker.service
# Status: sudo systemctl status wise2-docker.service
#
